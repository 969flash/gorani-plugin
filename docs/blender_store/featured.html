<!doctype html>
<!-- extensions.blender.org 대표 이미지(1920×1080) — 웹사이트(../../../urbansite) 스타일·축측 도해(합성 데이터)를 그대로 쓴다.
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --force-prefers-reduced-motion --window-size=1920,1080 --screenshot=build/blender_store/featured.png docs/blender_store/featured.html -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../urbansite/assets/style.css">
<style>
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  .card { position: absolute; inset: 48px; border: 2px solid var(--ink); background: var(--surface); display: flex; align-items: center; padding: 0 112px; gap: 48px; }
  .text { flex: 0 0 760px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; margin-bottom: 56px; }
  .brand svg { width: 44px; height: 44px; }
  h1 { font-size: 104px; line-height: 1.04; margin: 0 0 48px; }
  .lead { font-size: 30px; color: var(--ink-2); margin: 0; }
  .drawing { flex: 1; height: 860px; margin: 0; border: 0; background: none; }
  #axon { width: 100%; height: 100%; }
</style></head>
<body>
<div class="card">
  <div class="text">
    <div class="brand"><svg viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" fill="#fff" stroke="#111418" stroke-width="2"/><path d="M1 11h30M1 21h30M11 1v30M21 1v30" stroke="#C9D2DE" stroke-width="1.5"/><path d="M11 11h10v10H11z" fill="#0057FF"/></svg>UrbanSite</div>
    <h1><em>The city around<br>your site</em>, modeled<br>in Blender.</h1>
    <p class="lead">Free Blender add-on · buildings, roads, terrain and water around any site</p>
  </div>
  <figure class="drawing"><canvas id="axon" data-site="Site" data-radius="Radius {r}"></canvas></figure>
</div>
<script src="../../../urbansite/assets/site.js"></script>
</body></html>
