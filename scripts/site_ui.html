<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani</title>
<!--VENDOR_CSS-->
<style>
/* 번들 폰트 — 호스트가 base64 data URI로 치환 */
@font-face {
  font-family: "Pretendard Variable";
  src: url("<!--FONT_WOFF2-->") format("woff2-variations");
  font-weight: 45 920;
  font-display: swap;
}
/* ── 토큰 — UI 키트(docs/brand/ui_kit.html, 2026-10-19): Claude 데스크톱 앱처럼 둥글고 단순하게. 주 버튼은 잉크, 블루는 선택·포커스·링크에만 ── */
:root {
  --paper: #f5f6f8; --surface: #ffffff; --line: #e3e6eb; --line-2: #cdd3db;
  --ink: #111418; --ink-2: #4a5260; --ink-3: #7d8798; --hover: #f0f2f5; --press: #e5e8ed;
  --on-ink: #ffffff; --ink-hover: #2b3038; --ink-press: #3a414b;
  --accent: #0057ff; --accent-ink: #0047d6; --accent-wash: #e9f0ff; --ring: rgba(0, 87, 255, .35);
  --ok: #1f7a4d; --danger: #c43c3c; --danger-wash: #fdeeee; --warn: #a8460b; --warn-wash: #fff6ea;
  --map-bg: #e9ecef; --overlay: rgba(255, 255, 255, .94);
  --mono: "SF Mono", Menlo, Consolas, monospace;
  /* 수치(2026-10-20 정리) — 간격은 4의 배수, 모서리 셋(6 안쪽·8 컨트롤·12 카드)+알약, 컨트롤 높이 셋(28·32·36), 라벨 열 하나(64) */
  --lbl: 64px; --lbl-gap: 8px;
  color-scheme: light;
}
:root:lang(en), :root:lang(es) { --lbl: 92px; }   /* 라벨이 긴 언어 — 'Coordinates'·'Other scales'가 64 px에서 두 줄이 됐다 */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0c1016; --surface: #151b23; --line: #262e39; --line-2: #38424f;
    --ink: #e8ecf2; --ink-2: #a9b3c3; --ink-3: #7f8a9c; --hover: #1c232d; --press: #252d38;
    --on-ink: #111418; --ink-hover: #d3d9e2; --ink-press: #bcc4d0;
    --accent: #5b8bff; --accent-ink: #8cb0ff; --accent-wash: #16264a; --ring: rgba(91, 139, 255, .45);
    --ok: #5cc28f; --danger: #f07272; --danger-wash: #3a1b1d; --warn: #f0a35e; --warn-wash: #33240f;
    --map-bg: #1c232d; --overlay: rgba(21, 27, 35, .94);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
  font: 400 13px/20px "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  overflow: hidden;
}
::selection { background: var(--accent-wash); color: var(--ink); }
input, textarea { caret-color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2:focus-visible { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; line-height: 18px; }
.hint { color: var(--ink-2); font-size: 12px; line-height: 18px; }
.sub { color: var(--ink-3); font-weight: 400; font-size: 12px; line-height: 18px; }
h2 { font-size: 15px; font-weight: 600; line-height: 22px; margin: 0 0 8px; }
h3 { font-size: 13px; font-weight: 600; line-height: 20px; margin: 24px 0 8px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ico.mark { fill: currentColor; stroke: none; }

/* ── 헤더 — 마크 + 워드마크 + 더보기 ── */
header { flex: none; padding: 8px 12px 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.titlebar { height: 32px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; font-weight: 800; line-height: 32px; letter-spacing: -.01em; }
.brand .ico { width: 24px; height: 24px; vertical-align: 0; }
.brand-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; }
.brand-btn:hover { background: var(--hover); }
.ib { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; padding: 0; }
.ib.sm { width: 28px; height: 28px; border-radius: 6px; }
.ib:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.ib:active:not(:disabled) { background: var(--press); }
.ib[aria-expanded="true"] { background: var(--press); color: var(--ink); }
.ib.danger { color: var(--danger); }
.ib.danger:hover:not(:disabled) { background: var(--danger-wash); color: var(--danger); }
/* 언어 고르기 — 지구본 + 지금 언어 이름. 투명한 select가 위를 덮어 OS 목록이 뜬다(.native와 같은 방식) */
.hdr-acts { display: flex; align-items: center; gap: 4px; }
.lang-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); font-size: 12px; line-height: 18px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.lang-pick:hover { background: var(--hover); color: var(--ink); }
.lang-pick:has(select:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang-pick select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
/* 일본어·중국어 — Pretendard에 없는 가나·한자를 한국어 글꼴(Malgun Gothic)이 아니라 그 언어 글꼴로 */
html:lang(ja) body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, "Pretendard Variable", sans-serif; }
html:lang(zh-Hans) body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Pretendard Variable", sans-serif; }

/* ── 띠·블로커·메뉴·토스트 ── */
#init_warnings:empty { display: none; }
.band { padding: 8px 12px; margin: 8px 16px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; line-height: 18px; display: flex; gap: 8px; align-items: flex-start; }
.band.lv-danger { border-color: transparent; background: var(--danger-wash); color: var(--danger); }
.band.lv-info { color: var(--ink-2); }
/* 공지 띠 — warn(주황) = 업데이트·꼭 알아야 할 공지, note(파랑) = 일반 공지. 빨강(danger)은 오류에만 */
.band.lv-warn { border-color: transparent; background: var(--warn-wash); color: var(--warn); }
.band.lv-note { border-color: transparent; background: var(--accent-wash); color: var(--accent-ink); }
.band > .ico { flex: none; margin-top: 2px; }
.band > span { flex: 1; min-width: 0; }
.note { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: start; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 12px; color: var(--ink); }
.note:hover { background: var(--hover); }
.note .sub { color: var(--ink-3); white-space: nowrap; }
.note.lv-warn > .ico { color: var(--warn); } .note.lv-note > .ico { color: var(--accent-ink); }
.note.closed, .note.closed > .ico { color: var(--ink-3); }
.band .btn { margin-left: auto; flex: none; }
.band .btn + .btn { margin-left: 0; }
#blocker { position: absolute; inset: 0; background: var(--paper); padding: 24px 16px; z-index: 1000; overflow: auto; }
#blocker h2 { margin-bottom: 16px; }
/* 업데이트 모달 — 권장(닫기 있음)·강제(닫기 없음). 매니페스트 update 값으로 뜬다 */
#update_modal { position: fixed; inset: 0; z-index: 1100; background: rgba(17, 20, 24, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
#update_modal[hidden] { display: none; }
#update_modal .dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; max-height: 100%; overflow: auto; }
#update_modal .ver { font-size: 12px; color: var(--ink-3); margin: 0 0 4px; }
#update_modal p { color: var(--ink-2); margin: 0 0 12px; }
#update_modal ul { margin: 0 0 12px; padding-left: 18px; color: var(--ink-2); }
#update_modal ol { margin: 0 0 16px; padding: 10px 12px 10px 30px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); font-size: 12px; line-height: 1.9; }
#update_modal .due { color: var(--warn); font-size: 12px; }
#update_modal .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.check-list { display: grid; grid-template-columns: 1.4em 7em 1fr; gap: 4px 8px; margin-bottom: 16px; }
.check-list .ok { color: var(--ok); } .check-list .bad { color: var(--danger); } .check-list .opt { color: var(--ink-3); }
/* 더보기 메뉴 — 헤더 아래로 떠오르는 둥근 면(최근 대상지·설정·도움) */
#menu { position: absolute; top: 8px; left: 8px; right: 8px; max-height: calc(100% - 16px); overflow: auto; z-index: 1100; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
#menu h3:first-child { margin-top: 12px; }
/* 다이어그램 보기 창 — 칸을 누르면 패널 안에서 SVG를 본다. 누르면 확대(가로 스크롤) */
#viewer { position: absolute; inset: 0; z-index: 1200; display: flex; flex-direction: column; background: var(--paper); }
#viewer .vw-head { flex: none; display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 8px 12px 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
#viewer .vw-head h2 { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer .vw-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: grid; place-items: center; }
#viewer .vw-body img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
#viewer .vw-body.zoom { place-items: start; }
#viewer .vw-body.zoom img { width: 250%; max-width: none; cursor: zoom-out; }
#menu h3 { margin: 16px 0 8px; font-size: 11px; line-height: 16px; color: var(--ink-3); font-weight: 600; }
.mlist { display: grid; gap: 2px; }
.mrow { display: grid; grid-template-columns: var(--lbl) minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px; border-radius: 8px; font-size: 12px; line-height: 18px; }
.mrow:hover { background: var(--hover); }
.mrow .k { color: var(--ink-2); }
.mrow .v { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 16px; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: none; text-align: left; color: var(--ink); }
.recent:hover:not(:disabled) { background: var(--hover); }
.recent:disabled { color: var(--ink-3); }
.recent > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent > .ico:first-child { color: var(--ink-3); }
.menu-ver { margin: 12px 8px 0; color: var(--ink-3); font-size: 11px; line-height: 16px; }
#toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 8px 16px; border-radius: 8px; font-size: 12px; line-height: 18px; z-index: 1200; opacity: 0; transition: opacity .15s; pointer-events: none; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
#toast.show { opacity: 1; }
#toast.act { pointer-events: auto; }
#toast button { background: none; border: 0; padding: 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ── 본문·화면 — 화면은 둘: 지도(map)·결과(result) ── */
main { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--paper); }
section { display: none; height: 100%; }
body[data-screen="map"] section[data-screen="map"] { display: flex; flex-direction: column; padding: 12px 16px 0; }
/* 결과는 넓은 창에서도 내용 폭 880 px까지만(가운데) */
body[data-screen="result"] section[data-screen="result"] { display: block; overflow: auto; padding: 12px max(16px, calc((100% - 880px) / 2)) 16px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: contents; }
section[data-screen="map"] fieldset { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* ── 버튼 — 아이콘 + 글자. 주 = 잉크, 보조 = 흰 면 + 옅은 테두리, 고스트 = 테두리 없음 ── */
.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { background: var(--press); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn.primary:active:not(:disabled) { background: var(--ink-press); border-color: var(--ink-press); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 8px; }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.btn.danger, .link.danger-text { color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-wash); }
.btn.sm { height: 28px; padding: 0 8px; border-radius: 6px; font-size: 12px; line-height: 18px; gap: 4px; }
.btn.ghost.sm { padding: 0 8px; }
.btn:disabled { opacity: .4; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-size: 12px; line-height: 18px; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { color: var(--ink-3); text-decoration: none; }
.danger-text { color: var(--danger); }
/* 입력칸 — 둥근 8 px, 포커스는 블루 테두리 + 옅은 링 */
input[type="text"], input[type="search"], input[type="number"], select { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }
input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--ring); }
input[type="number"].sm, select.sm { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12px; line-height: 18px; }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; margin: 0 8px 0 0; accent-color: var(--accent); vertical-align: -3px; }
label.chk { display: flex; align-items: center; min-height: 32px; }
/* 세그먼트 — 하나만 고르는 칸(범위·크기·용지·좌표·지형·프리셋). 옅은 트랙 위 고른 칸만 흰 면 */
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; gap: 2px; border-radius: 8px; background: var(--press); max-width: 100%; }
.seg label, .seg .sb { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: 12px; line-height: 18px; cursor: pointer; white-space: nowrap; }
.seg label:hover, .seg .sb:hover { color: var(--ink); }
.seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; left: 0; top: 0; cursor: pointer; }
.seg label:has(input:checked), .seg .sb[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--line); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
/* 칩 — 켜고 끄는 것(더 그리기) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.chip2 { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: 12px; line-height: 18px; }
.chip2:hover { background: var(--hover); }
.chip2[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
/* [직접] — 같은 세그먼트 칸. 고르면 옆에 입력칸이 나온다 */
.direct { display: none; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; color: var(--ink-2); }
.direct input[type="number"] { width: 76px; height: 32px; }
.seg:has(input[value="custom"]:checked) + .direct, .direct.on { display: inline-flex; }
.tile-b .row .direct { margin-left: calc(var(--lbl) + var(--lbl-gap)); }

/* ── 지도 화면 — 위 도구줄(방식 칸 + 검색), 지도, 아래 트레이(대상지·범위·3D 설정) ── */
.toolrow { display: flex; gap: 8px; position: relative; margin-bottom: 8px; align-items: center; }
/* 방식 칸 두 묶음 — [필지│구역] = 대상지 정하기, [위치] = 대상지 없이 */
.mode-groups { display: flex; gap: 8px; flex: none; }
.modes { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--press); }
.modes button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: 12px; line-height: 18px; white-space: nowrap; }
.modes button:hover:not(:disabled):not([aria-pressed="true"]) { color: var(--ink); }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--line); }
.modes button:disabled { opacity: .4; }
.search { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; height: 32px; padding: 0 4px 0 2px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.search input { flex: 1; min-width: 0; height: 28px; border: 0; padding: 0 4px; background: transparent; }
.search input:focus { box-shadow: none; }
.search input::placeholder { color: var(--ink-3); }
#search_msg { min-height: 18px; margin: -4px 0 4px; }
#search_msg:empty { min-height: 0; margin: 0; }
#search_list { position: absolute; top: 36px; left: 0; right: 0; z-index: 900; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); max-height: 264px; overflow: auto; }
#search_list li { height: 36px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
#search_list li .sub { margin-left: auto; white-space: nowrap; }
#search_list li[aria-selected="true"], #search_list li:hover { background: var(--hover); }
.map-slot { position: relative; isolation: isolate; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--map-bg); flex: 1; min-height: 240px; }
#map { width: 100%; height: 100%; }
#map_park { display: none; }
/* 지도 위 안내 — 다음에 할 일 한 줄. 대상지가 생기면 사라진다 */
.guide { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 800; max-width: calc(100% - 20px); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); color: var(--ink); padding: 4px 12px; font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.map-chips { position: absolute; left: 8px; bottom: 8px; z-index: 800; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.chip { background: var(--overlay); border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 18px; color: var(--ink-2); }
.chip.lv-danger { color: var(--danger); }
.leaflet-container { font: inherit; }
.leaflet-bar { border: 1px solid var(--line) !important; border-radius: 8px !important; overflow: hidden; box-shadow: 0 1px 2px rgba(0, 0, 0, .08) !important; }
.leaflet-bar a { border-radius: 0 !important; width: 32px !important; height: 32px !important; line-height: 32px !important; color: var(--ink) !important; }
.aerial-ctl a { font-size: 11px; line-height: 16px; color: var(--ink-2); }
.aerial-ctl a[aria-pressed="true"] { color: var(--accent-ink); font-weight: 600; background: var(--accent-wash); }
.leaflet-container.aerial .map-label { color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.85); }
.map-label { background: none; border: 0; box-shadow: none; color: #5c5c58; font-size: 11px; line-height: 16px; padding: 0; }
.map-label.extent { color: #111418; font-weight: 600; }
.leaflet-container.drawing { cursor: crosshair; }
/* 트레이 자리 고정(2026-10-20) — 높이는 창 높이로만 정한다(고르기·펼치기로 바뀌지 않아 지도가 밀리지 않는다).
   창이 크면 3D 설정까지 펼친 높이(392)까지 늘고, 그보다 크면 지도가 커진다. 작으면 200에서 트레이 안 스크롤(scrollTray)
   480 = 헤더 49 + 도구줄 40 + 위 여백 12 + 푸터 57 + 지도 최소 314 + 간격 8 (2026-10-21 Rhino QA: 창을 키워도 아래 카드가 잘렸다) */
/* 좌우 8 px 여백 = 최근 대상지 줄(.mlist margin 0 -8px)의 자리 — 없으면 줄이 8 px 넘쳐 가로 스크롤바가 생긴다(2026-10-21 SketchUp QA, 늘 보이는 스크롤바) */
.tray { flex: none; height: clamp(200px, calc(100vh - 480px), 392px); margin: 8px -8px 0; padding: 0 8px 8px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
.tray.scrolled { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16px); mask-image: linear-gradient(to bottom, transparent 0, #000 16px); }   /* 스크롤하면 위 끝을 흐려 지도와 붙어 보이지 않게 */
.tray-empty .tray-h { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; line-height: 16px; font-weight: 600; color: var(--ink-3); }
.tray-empty .mlist { margin: 0 -8px; }
.tray-empty .hint { padding: 8px 0; }
.trow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 40px; }
.trow .lbl { width: var(--lbl); flex: none; color: var(--ink-2); }
.trow .tval { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .total { font-size: 15px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trow .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px calc(var(--lbl) + var(--lbl-gap)); }
.tname { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; height: 28px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); }
.tname:hover { background: var(--hover); }
.tname .ico { color: var(--ink-3); transition: transform .12s; }
.tname[aria-expanded="true"] .ico { transform: rotate(180deg); }
.lot-more > summary { display: none; }
.lot-more .body { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 0 0 4px calc(var(--lbl) + var(--lbl-gap)); padding: 4px; font-size: 12px; line-height: 18px; }
.chip-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 8px; border-radius: 8px; cursor: pointer; }
.chip-row:hover, .chip-row:focus-visible { background: var(--hover); }
.chip-row .x { margin-left: auto; }
.lot-info { padding: 4px 8px 8px; }
.li-head { display: flex; align-items: center; min-height: 28px; margin-top: 8px; }
.li-head:first-child { margin-top: 0; }
.li-head .end { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.li-head.chip-row { padding: 0 0 0 8px; margin-left: -8px; margin-right: -4px; gap: 8px; }
.li-row { display: grid; grid-template-columns: var(--lbl) 1fr; gap: 8px; min-height: 20px; }
.li-row > :first-child { color: var(--ink-2); }
.li-row .flag { color: var(--warn); }
.lot-info .hint { margin: 8px 0 0; }
.badge-warn { font-size: 11px; line-height: 16px; color: var(--warn); background: var(--warn-wash); padding: 0 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
/* 3D 설정 — 접어 두고 요약 한 줄 */
details.s3d { margin-top: 4px; }
details.s3d > summary { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; list-style: none; border-radius: 8px; }
details.s3d > summary::-webkit-details-marker { display: none; }
details.s3d > summary .lbl { width: var(--lbl); flex: none; color: var(--ink); font-weight: 600; }
details.s3d > summary .sum { flex: 1; min-width: 0; color: var(--ink-3); font-size: 12px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.s3d > summary .ico { color: var(--ink-2); transition: transform .15s; }
details.s3d[open] > summary .ico { transform: rotate(180deg); }
details.s3d .body { padding: 0 0 4px; }
details.s3d .trow { min-height: 40px; }

/* ── 결과 ── */
/* 진행 — 4 px 막대 위로 달리는 고라니(위치 = 진행률, 다리 장 = 진행 푸시마다 한 장씩) */
.track { position: relative; height: 44px; margin: 8px 0 4px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--press); }
.track .fill { position: absolute; left: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--ink); width: 0; }   /* 전환 없음 — Rhino가 바쁘면 화면이 드문드문 그려져 전환 시작점(0 %)에 멈춰 보였다(2026-10-19 Rhino QA) */
.track .runner { position: absolute; bottom: 4px; left: 0; width: 48px; height: 36px; overflow: hidden; color: var(--ink); }
.track .runner .frames { display: flex; width: 384px; }
.track .runner svg { flex: none; width: 48px; height: 36px; display: block; }
.track.live .runner .frames { animation: gorani-run .64s steps(8) infinite; }
@keyframes gorani-run { to { transform: translateX(-384px); } }
@media (prefers-reduced-motion: reduce) { .track.live .runner .frames { animation: none; } }
.prog-meta { display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--ink-2); }
.prog-meta b { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 24px; }
.phase-list { margin: 8px -8px 0; padding: 0; list-style: none; }
.phase-list li { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 8px; }
.phase-list li .ic { width: 16px; display: inline-flex; }
.phase-list li .det { margin-left: auto; color: var(--ink-3); font-size: 12px; line-height: 18px; text-align: right; }
.phase-list li.st-pending { color: var(--ink-3); }
.phase-list li.st-done .ic { color: var(--ok); } .phase-list li.st-running { font-weight: 600; } .phase-list li.st-running .ic { color: var(--ink); } .phase-list li.st-failed .ic { color: var(--danger); }
.log { margin: 4px 0 12px; }
.log details summary { font-size: 12px; color: var(--ink-2); cursor: pointer; line-height: 28px; }
.log pre { margin: 4px 0 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 12px; line-height: 18px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
.log .lw { color: var(--warn); } .log .le { color: var(--danger); }
.err-card { border-radius: 12px; background: var(--danger-wash); padding: 16px; margin: 12px 0; }
.err-card h4 { margin: 0 0 4px; font-size: 13px; line-height: 20px; color: var(--danger); }
.err-card pre { font-family: var(--mono); font-size: 12px; line-height: 18px; white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 4px 0; }
.err-card .acts { display: flex; gap: 8px; margin-top: 12px; }
.err-card p { margin: 0 0 4px; color: var(--ink); }
.err-card .todo { margin: 0 0 4px; padding-left: 20px; color: var(--ink); }
.err-card .todo li { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.card > .top { padding: 16px; display: grid; gap: 4px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.f2d-head { display: flex; align-items: center; gap: 8px; }
.f2d-head h3 { margin: 0; flex: 1; }
.card .acts .k { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.card .red { color: var(--danger); font-size: 12px; line-height: 18px; margin-top: 4px; }
.done-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.done-line .num { margin-left: 4px; }
/* 3D 블록 — 숫자 칸 셋 · 파일 위치 · 다시 불러오기 안내 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0 4px; }
.stat { display: grid; gap: 4px; padding: 8px 12px; background: var(--paper); border-radius: 8px; min-width: 0; }
.stat .k { font-size: 11px; line-height: 16px; color: var(--ink-3); }
.stat .v { font-size: 13px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done-head { display: flex; align-items: center; gap: 8px; }
.done-head .done-line { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-acts { display: flex; gap: 8px; flex: none; }
.card .files { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }
.doc-again { margin: 4px 0 0; }
.doc-again:empty { display: none; }
.card2d .top h3 { margin: 0 0 4px; padding: 0; border: 0; }
/* 진행 카드(3D·2D 같은 꼴) — 제목 + 오른쪽 위 [취소], 대상지 줄, 막대, 단계, 안내. 로그는 카드 밖 */
.job .track { margin-top: 12px; }
.job .job-note { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
/* 2D 카드 타일 — 누르면 켜지고, 켠 타일 안에만 칩 */
.tile2d { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-top: 8px; overflow: hidden; }
.tile2d.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tile-h { display: grid; grid-template-columns: 24px minmax(0, 1fr) 16px; gap: 12px; align-items: center; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; color: var(--ink); }
.tile-h:hover { background: var(--hover); }
.tile-h .ti-ic { color: var(--ink-2); display: inline-flex; }
.tile2d.on .tile-h .ti-ic { color: var(--ink); }
.tile2d.on .tile-h .ti-ck { color: var(--accent); }
.tile-h .ti-ic .ico { width: 20px; height: 20px; }
.tile-h .ti-t { display: grid; gap: 2px; min-width: 0; }   /* 20 + 2 + 18 = 40, 위아래 12 → 타일 머리 64 */
.tile-h .ti-t b { font-weight: 600; font-size: 13px; line-height: 20px; }
.tile-b { padding: 0 16px 16px 52px; display: grid; gap: 8px; }   /* 52 = 왼쪽 16 + 아이콘 24 + 12 — 타일 제목 글자와 같은 세로선 */
.tile-b .row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 32px; }
.tile-b .lbl { width: var(--lbl); flex: none; color: var(--ink-2); font-size: 12px; line-height: 18px; }
.sheet-pick .grp { font-size: 12px; line-height: 18px; color: var(--ink-3); margin-top: 4px; }
.grid13 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.grid13 label { min-height: 28px; font-size: 12px; line-height: 18px; }
.sub-h { display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px 8px; font-size: 12px; line-height: 18px; color: var(--ink-2); border-top: 1px solid var(--line); }
.sub-h #applied_style { color: var(--ink-3); }
/* 결과 파일 덩어리 — 라벨 열 64 px 하나에 줄을 맞춘다 */
.fblock { display: grid; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.frow { display: grid; grid-template-columns: var(--lbl) minmax(0, 1fr); align-items: center; gap: 8px; min-height: 28px; }
.frow .k { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.fblock #bm_err:empty { display: none; }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; padding: 4px 16px 16px; }   /* 칸 폭 고정·칸 수가 폭 따라 */
.sheet-cell { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); padding: 8px 0; text-align: left; display: grid; gap: 0; min-width: 0; align-content: start; color: var(--ink); }
.sheet-cell img { display: block; width: 100%; aspect-ratio: 1; border-bottom: 1px solid var(--line); margin: -8px 0 8px; }
.sheet-cell .n, .sheet-cell .t { padding: 0 8px; }
.sheet-cell.empty img { opacity: .45; }
.sheet-cell:hover:not(:disabled) { border-color: var(--line-2); background: var(--hover); }
.sheet-cell .n { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; line-height: 20px; }
.sheet-cell .t { min-height: 32px; font-size: 11px; line-height: 16px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sheet-cell.empty { color: var(--ink-3); cursor: default; }
.sheet-cell.empty .t { color: var(--ink-3); }
.style-dirty { font-size: 11px; line-height: 16px; color: var(--warn); }
.style-pick { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.style-pick select { flex: 1; min-width: 0; }

/* ── 도면 스타일 (결과 안 하위 화면) — 미리보기는 위에 고정해 아래 항목을 바꾸며 본다 ── */
.st-top { position: sticky; top: -12px; z-index: 5; background: var(--paper); padding: 12px 0 8px; margin-top: -12px; }
.st-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.st-head h2 { margin: 0; }
.st-head .sub { margin-left: auto; }
.st-preview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; line-height: 0; position: relative; min-height: 120px; }
.st-preview svg { width: 100%; height: auto; max-height: 36vh; display: block; }
.st-preview .wait { position: absolute; right: 8px; top: 8px; line-height: 16px; font-size: 11px; color: #4a5260; background: #fff; border: 1px solid #e3e6eb; border-radius: 999px; padding: 0 8px; }
.cells { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.cell { min-height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 8px 12px; font-size: 12px; line-height: 18px; color: var(--ink-2); text-align: left; min-width: 0; }
.cell:hover { background: var(--hover); color: var(--ink); }
.cell[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--ink); font-weight: 600; }
.cell.c { align-items: center; text-align: center; }
.strip { display: flex; width: 100%; height: 8px; border-radius: 4px; overflow: hidden; outline: 1px solid var(--line); }
.strip i { flex: 1; }
.st-legend { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 4px; }
.st-legend .grp { font-size: 11px; line-height: 16px; color: var(--ink-3); padding: 8px 8px 4px; }
.el { display: grid; grid-template-columns: 32px 1fr auto 16px; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: none; text-align: left; width: 100%; color: var(--ink); }
.el:hover { background: var(--hover); }
.el[aria-expanded="true"] { background: var(--hover); font-weight: 600; }
.el .sw { width: 32px; height: 16px; border: 1px solid var(--line-2); border-radius: 4px; }
.el .sw.line { border: 0; position: relative; }
.el .sw.line::after { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; border-radius: 1px; background: var(--c); }
.el .hex { font-size: 12px; line-height: 18px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.el .ico { transition: transform .15s; }
.el[aria-expanded="true"] .ico { transform: rotate(180deg); }
.picker { display: grid; gap: 8px; padding: 8px; margin: 4px 0 8px; border-radius: 8px; background: var(--paper); }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.swatches button { aspect-ratio: 3 / 2; border: 1px solid var(--line-2); border-radius: 6px; padding: 0; color: var(--ink); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick-row { display: flex; gap: 8px; align-items: center; }
.pick-row input[type="text"] { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.native { position: relative; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); display: inline-flex; align-items: center; padding: 0 12px; white-space: nowrap; cursor: pointer; font-weight: 500; }
.native:hover { background: var(--hover); }
.native input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.pick-err { color: var(--warn); font-size: 12px; line-height: 18px; }
.lockline { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12px; line-height: 18px; padding: 8px; }
.st-save { display: flex; gap: 8px; flex: 1; min-width: 0; }
.st-save input { flex: 1; min-width: 0; }
.st-msg { flex: 1; min-width: 0; color: var(--ink-2); font-size: 12px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 푸터 ── */
footer { flex: none; min-height: 56px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); }
/* 지역 데이터 받기(지도에서) — 지도 밖, 푸터 위 한 줄. 생성 중 받기는 진행 목록에 나온다 */
#dl { flex: none; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 16px; font-size: 11px; line-height: 16px; color: var(--ink-2); background: var(--surface); border-top: 1px solid var(--line); }
#dl .dl-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--press); overflow: hidden; }
#dl .dl-bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink); }
#dl button { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

@media (max-width: 419px) {
  .modes .t { display: none; }
  .sheet-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
"use strict";
// ── 브리지 (docs/panel_ui.md) ──
window.__outbox = []; window.__seq = 0;
// 브라우저 패널(Blender·SketchUp — panel_server가 127.0.0.1에 띄운 서버): 명령은 POST cmd, 상태는 SSE events. 토큰이 없으면 웹뷰(Rhino)
var BRIDGE_TOKEN = (location.search.match(/[?&]token=([\w-]+)/) || [])[1];
// 웹판(web_app.html이 iframe으로 띄운다): 명령은 부모 창으로, 푸시는 부모가 app.receive로 넘긴다
var WEB = /[?&]web=1/.test(location.search) && window.parent !== window;
var HOST = { id: "rhino", name: "Rhino", model: "context.3dm", dwg: true };   // init_state.host로 바뀐다
var REGION_CMDS = { search: 1, set_area: 1, set_point: 1, preflight: 1 };   // 데이터 모드(region)를 붙여 보내는 명령 — 필지 DB를 볼지 OSM을 쓸지
function send(msg) {
  if (REGION_CMDS[msg.cmd]) msg.region = region();
  if (LANG) msg.lang = LANG;   // Python 문구·결과 파일도 같은 언어로(cmd_site.handle)
  if (BRIDGE_TOKEN) { fetch("cmd?token=" + BRIDGE_TOKEN, { method: "POST", body: JSON.stringify(msg) }); return; }
  if (WEB) { window.parent.postMessage({ gorani: msg }, location.origin); return; }
  window.__outbox.push(msg);
  document.title = "bridge" + (++window.__seq);  // Windows WebView2 — title 이벤트
  location.href = "bridge:flush";                // mac WKWebView — DocumentLoading에서 가로챈다
}
window.__flush = function () { var m = JSON.stringify(window.__outbox); window.__outbox = []; return m; };

// ── 언어 — 사전은 호스트가 I18N 자리표시(script 앞 주석)에 심는다(scripts/i18n.json, 키 = 한국어 원문, Python i18n.tr과 공용) ──
// 번역문에는 " & < >가 없다(tests/test_i18n.py) — 한국어 원문처럼 HTML에 그대로 넣는다. 자리 값(주소 등 자료)은 전처럼 esc
var I18N = window.I18N || {};
var LANG = null;   // init_state(options.lang)가 오기 전에는 모른다 — 그동안은 영어
var LANG_NAMES = { en: "English", ko: "한국어", es: "Español", ja: "日本語", zh: "简体中文" };   // 그 언어로 쓴 이름 — 못 읽는 언어로 바뀌어도 고를 수 있게(constants.LANGS 순서)
function tr(s) {
  var lang = LANG || "en", e = lang !== "ko" && I18N[s], r = e ? e[lang] || e.en || s : s, a = arguments;
  return a.length > 1 ? r.replace(/\{(\d+)\}/g, function (m, i) { var v = a[+i + 1]; return v == null ? "" : v; }) : r;
}
function sqm() { return LANG === "ko" || LANG === "ja" || LANG === "zh" ? "㎡" : "m²"; }
function hostName() { return tr(HOST.name); }   // 웹판 '브라우저'만 번역된다
function pickLang(v) { return v && typeof v === "object" && !Array.isArray(v) ? v[LANG] || v.en || v.ko || "" : v; }   // 매니페스트 공지·업데이트 문구 — 문자열 또는 {en, ko, …}
function siteKey() { return LANG === "ko" ? "website" : "website_en"; }   // 웹페이지 — 한국어 밖은 영어 페이지(constants.PANEL_LINKS)
// 화면을 다시 그리지 않는 자리(헤더·지도 칩·위성 단추·접근성 이름)
function applyStaticText() {
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : LANG || "en";

      var key = state.lots.slice().sort().join();
      state.init.recent = [{ pnus: state.lots.slice(), label: String(m.lot_name || "").replace(/_/g, " "), total_area: state.lotState.total_area, date: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) }]
        .concat((state.init.recent || []).filter(function (r) { return r.pnus.slice().sort().join() !== key; })).slice(0, 5);
    }
    announce(docTitle());
  },
  made_2d: function (m) {
    clearInterval(timers.elapsed);
    if (!state.result || m.dir !== state.result.dir) return;
    if (m.ok) {
      // 2D는 만들 때마다 새 폴더(2D_<스타일>_<HHMM>) — 카드도 이번 것만 보인다. 앞 폴더는 결과 폴더에 그대로 남는다
      var bm = m.basemap || {};
      state.made2d = { elapsed_s: m.elapsed_s, folder: m.folder, options: m.options, basemap: Object.assign({}, bm, { exported: (bm.exported || []).slice(), ready: !!bm.ready, dwg: bm.dwg || "" }),
        sheets: m.sheets || [], tables: m.tables || [] };
      state.result.sheets = state.made2d.sheets;
      if ((m.sheets || []).length) { state.appliedStyle = fullStyle((m.options || {}).style); state.styleEdit = clone(state.appliedStyle); }
      state.job2d = "done"; state.form2d = false;
      toast(tr("2D 자료를 만들었습니다"));
    } else {
      state.job2d = m.cancelled ? "cancelled" : "failed";
      state.err2d = m.cancelled ? tr("취소했습니다. 만든 데까지 폴더에 남아 있습니다") : ((m.error && m.error.title) || tr("2D 자료를 만들지 못했습니다"));
      state.err2dObj = m.cancelled ? null : (m.error || { title: state.err2d });
      state.form2d = true;
    }
    state.dl = null; renderCard2d(); renderFooter();
  },
  imported: function (m) {
    if (state.run === "running") return;   // 생성 경로 — done.context로 그린다
    applyImported(!!m.ok, m.text, m.layers, m.objects);
  },
  exported: function (m) {
    if (!state.result || !state.made2d) return;
    if (m.ok) { var ex = state.made2d.basemap.exported; if (ex.indexOf(m.path) < 0) ex.push(m.path); renderExportedList(); toast(tr("{0}을 만들었습니다", m.path.split(/[\\/]/).pop())); }
    else slotError("bm_err", (m.text || tr("내보내기 실패")) + " " + tr("(log.txt 확인)"));
  },
  error: function (m) {
    appendLog(tr("오류") + " " + m.context + ": " + m.text + (m.detail ? "\n" + m.detail : ""), "error");
    var text = m.text || tr("오류");
    switch (m.context) {
      case "generate":
        if (state.job2d === "running") handlers.made_2d({ dir: state.result.dir, ok: false, cancelled: false, error: { title: text, detail: m.detail || "", code: "exception" } });
        else if (state.run === "running") handlers.progress({ state: "failed", phase: state.progress ? state.progress.phase : "query", phase_status: state.progress ? state.progress.phase_status : {}, phase_detail: {}, percent: 0, error: { title: text, detail: m.detail || "", code: "exception" } });
        else showErrorBand(text);
        break;
      case "import": var dc = $("doc_status"); if (dc) dc.innerHTML = docStatusHtml(false, text, state.result && state.result.context.path); else showErrorBand(text); break;
      case "export": slotError("bm_err", text); break;
      case "style": if ($("st_msg")) $("st_msg").textContent = text; else showErrorBand(text); var w = $("st_wait"); if (w) w.hidden = true; break;
      case "search": slotError("search_msg", text); break;
      case "select": slotError("tray_err", text); break;
      case "preflight": break;
      case "view": var vb = document.querySelector("#viewer .vw-body"); if (vb) vb.innerHTML = '<span class="danger-text">' + esc(text) + "</span>"; else showErrorBand(text); break;
      default: showErrorBand(text);
    }
  }
};
window.app = { receive: function (msg) { var h = handlers[msg && msg.type]; if (h) h(msg); else console.warn("unknown push", msg); } };

$("lang_pick").innerHTML = Object.keys(LANG_NAMES).map(function (k) { return '<option value="' + k + '">' + LANG_NAMES[k] + "</option>"; }).join("");
applyStaticText();

// ── 목 모드 (?mock=1) — Rhino 없이 브라우저에서. &step=1 지도까지 · (기본) 3D 완료 · &step=2d 2D까지 · &menu=1 메뉴 · &lang=ko 언어 ──
var MOCK = /[?&]mock=1/.test(location.search);
if (MOCK) {
  send = function (msg) { console.log("[send]", JSON.stringify(msg)); };
  var upto = (location.search.match(/[?&]step=(\w+)/) || [])[1] || "3d";
  var w = (location.search.match(/[?&]w=(\d+)/) || [])[1]; if (w) document.documentElement.style.width = w + "px";
  var playMock = function (msgs) {
    var after3d = { progress: 1, log: 1, data_progress: 1, busy: 1, imported: 1, done: 1, made_2d: 1, exported: 1, _mock_make2d: 1 };
    state.mode = state.mode || "lots";   // 목 데이터는 필지 방식
    var ml = (location.search.match(/[?&]lang=(\w+)/) || [])[1]; if (ml) msgs[0].options = Object.assign({}, msgs[0].options, { lang: ml });
    var up = (location.search.match(/[?&]update=(\w+)/) || [])[1];   // &update=soft|hard — 업데이트 모달 보기
    if (up) msgs[0].update = up === "hard" ? { latest: "0.3.0", min: "0.3.0" }
      : { latest: "0.3.0", body: "새 버전부터 계정으로 로그인합니다. 무료로 계속 쓸 수 있습니다.", deadline: "12월 1일",
          items: ["로그인과 최근 대상지 동기화", "결과 화면 하단 후원 안내", "현황도 3종 추가"] };
    if (up || /[?&]notice=1/.test(location.search)) {
      msgs[0].notices = [
        { id: "2026-11-maint", level: "info", date: "2026-10-28", text: "11월 3일 02~06시 서버 점검으로 DB 받기가 멈춥니다", url: "https://969flash.github.io/gorani/" },
        { id: "2026-10-gg-height", level: "warn", date: "2026-10-25", text: "경기 건물 높이 오류를 고쳤습니다. 경기 지역은 DB를 다시 받으세요" },
        { id: "2026-09-launch", level: "info", date: "2026-09-30", text: "Gorani를 공개했습니다" }];
      msgs[0].options = Object.assign({}, msgs[0].options, { closed_notices: ["2026-09-launch"] });
    }
    var i = 0;
    var tick = function () {
      if (i >= msgs.length) { if (/[?&]menu=1/.test(location.search)) openMenu(); return; }
      var m = msgs[i++];
      if (upto === "1" && after3d[m.type]) { i = msgs.length; tick(); return; }
      if (m.type === "_mock_make2d") {
        if (upto !== "2d") { i = msgs.length; tick(); return; }
        Object.assign(state.options, m.options || {}); startMake2d(); setTimeout(tick, 300); return;
      }
      if ((m.type === "progress" || m.type === "log" || m.type === "data_progress") && state.run === "idle") startGenerate();
      window.app.receive(m);
      setTimeout(tick, 300);
    };
    tick();
  };
  var loadMock = function () {
    var inline = $("mock");
    if (inline) { playMock(JSON.parse(inline.textContent)); return; }
    fetch("../tests/fixtures/site_ui_mock.json").then(function (r) { return r.json(); }).then(playMock)
      .catch(function (e) { console.error("목 데이터 로드 실패. Chrome은 --allow-file-access-from-files 필요", e); });
  };
  var css = document.createElement("link"); css.rel = "stylesheet"; css.href = "./vendor/leaflet.css"; document.head.appendChild(css);
  var loadI18n = function () {   // 호스트가 사전을 심지 않은 목(파일로 연 HTML)이면 옆의 i18n.json
    if (Object.keys(I18N).length) { loadMock(); return; }
    fetch("./i18n.json").then(function (r) { return r.json(); }).then(function (d) { I18N = d; }).catch(function () {}).then(loadMock);
  };
  var js = document.createElement("script"); js.src = "./vendor/leaflet.js"; js.onload = loadI18n; document.body.appendChild(js);
} else if (BRIDGE_TOKEN) {   // 브라우저 패널 — 이벤트 줄이 열린 뒤 init(먼저 보내면 답을 놓친다). 다시 연결돼도 init으로 전부 다시 받는다
  var events = new EventSource("events?token=" + BRIDGE_TOKEN);
  events.onmessage = function (e) { window.app.receive(JSON.parse(e.data)); };
  events.onopen = function () { send({ cmd: "init" }); };
} else {
  send({ cmd: "init" });
}
</script>
</body>
