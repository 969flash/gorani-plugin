<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대지검토</title>
<!--VENDOR_CSS-->
<style>
/* 번들 폰트 — 호스트가 base64 data URI로 치환 */
@font-face {
  font-family: "Pretendard Variable";
  src: url("<!--FONT_WOFF2-->") format("woff2-variations");
  font-weight: 45 920;
  font-display: swap;
}
/* ── 토큰 (ui_spec §9) ── */
:root {
  --bg: #f5f6f7; --surface: #fff; --border: #e3e6ea;
  --ink: #1c2128; --sub: #6b7480; --muted: #a0a7b1;
  --accent: #2f6fed; --accent-dn: #1f55c4; --accent-bg: #e9f0fd;
  --ok: #1f7a4d; --warn: #b4600a; --warn-bg: #fff4e5; --danger: #c43c3c; --danger-bg: #fdeaea;
  --bar1: #3b4452; --bar2: #6b7480; --bar3: #a0a7b1; --bar4: #d5d9de;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  font: 400 13px/1.5 "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2:focus-visible { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.hint { color: var(--sub); font-size: 12px; }
.sub { color: var(--sub); font-weight: 400; font-size: 12px; }
h2 { font-size: 16px; font-weight: 600; line-height: 1.3; margin: 0 0 8px; }
h3 { font-size: 13px; font-weight: 600; line-height: 1.4; margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; }

/* ── 헤더 ── */
header { flex: none; height: 56px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.titlebar { height: 28px; display: flex; align-items: center; justify-content: space-between; }
.titlebar h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 28px; }
#badges { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--sub); background: none; border: 0; padding: 0 4px; height: 24px; border-radius: 999px; }
#badges:hover { background: var(--bg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; }
.dot.lv-ok { background: var(--ok); } .dot.lv-warn { background: var(--warn); } .dot.lv-danger { background: var(--danger); } .dot.lv-missing { background: var(--muted); }
.stepper { height: 28px; margin: 0; padding: 0; list-style: none; display: flex; align-items: center; }
.stepper li { display: flex; align-items: center; flex: 1; }
.stepper li:last-child { flex: none; }
.stepper li::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 8px; }
.stepper li:last-child::after { display: none; }
.stepper button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0 2px; height: 24px; color: var(--sub); font-size: 12px; white-space: nowrap; }
.stepper button .o { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
.stepper button[aria-current] { color: var(--ink); font-weight: 600; }
.stepper button[aria-current] .o { background: var(--accent); border-color: var(--accent); }
.stepper button.done { color: var(--ink); }
.stepper button.done .o { border-color: var(--accent); color: var(--accent); }
.stepper button:disabled { color: var(--muted); }

/* ── 띠·블로커·토스트 ── */
#init_warnings:empty { display: none; }
.band { padding: 6px 12px; margin: 8px 16px 0; border-left: 3px solid var(--muted); background: var(--surface); font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }
.band.lv-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.band.lv-danger { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.band.lv-info { color: var(--sub); }
.band .btn { margin-left: auto; flex: none; }
#blocker { position: absolute; inset: 0; background: var(--bg); padding: 24px 16px; z-index: 1000; overflow: auto; }
#blocker h2 { margin-bottom: 16px; }
.check-list { display: grid; grid-template-columns: 1.2em 7em 1fr; gap: 4px 8px; margin-bottom: 16px; }
.check-list .ok { color: var(--ok); } .check-list .bad { color: var(--danger); } .check-list .opt { color: var(--muted); }
#toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; z-index: 60; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.show { opacity: 1; }

/* ── 본문·섹션 ── */
main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
section { display: none; height: 100%; }
body[data-step="1"] section[data-step="1"], body[data-step="2"] section[data-step="2"] { display: flex; flex-direction: column; padding: 8px 16px 0; }
body[data-step="3"] section[data-step="3"], body[data-step="4"] section[data-step="4"] { display: block; overflow: auto; padding: 8px 16px 12px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: contents; }
body[data-run="running"] section[data-step="1"], body[data-run="running"] section[data-step="2"], body[data-run="running"] section[data-step="3"] { pointer-events: none; }
section[data-step="1"] fieldset, section[data-step="2"] fieldset { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.range-controls { flex: none; padding: 6px 0 8px; }
.range-controls .row { min-height: 32px; }

/* ── 버튼·입력 ── */
.btn { height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg); }
.btn.primary { background: var(--accent-dn); border-color: var(--accent-dn); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { color: var(--muted); background: var(--surface); }
.btn.primary:disabled { background: var(--border); border-color: var(--border); }
.btn small { font-size: 11px; color: var(--sub); font-weight: 400; }
.btn.primary small { color: rgba(255,255,255,.8); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
.link:hover { text-decoration: underline; }
.link:disabled { color: var(--muted); text-decoration: none; }
.danger-text { color: var(--danger); }
input[type="text"], input[type="search"], input[type="number"], select { height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
input[type="number"].sm, select.sm { height: 28px; padding: 0 6px; font-size: 12px; }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; margin: 0 6px 0 0; accent-color: var(--accent); vertical-align: -3px; }
label.chk { display: flex; align-items: center; min-height: 32px; }

/* ── ① 대상지 ── */
.search { display: flex; gap: 8px; position: relative; }
.search input { flex: 1; min-width: 0; }
#search_msg { min-height: 18px; margin: 2px 0 4px; }
#search_list { position: absolute; top: 40px; left: 0; right: 0; z-index: 20; margin: 0; padding: 4px 0; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; max-height: 264px; overflow: auto; }
#search_list li { height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
#search_list li .sub { margin-left: auto; white-space: nowrap; }
#search_list li[aria-selected="true"], #search_list li:hover { background: var(--accent-bg); }
.map-slot { position: relative; isolation: isolate; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #e9ecef; }
.map-slot-1 { flex: 1; min-height: 200px; }
.map-slot-2 { flex: 1; min-height: 320px; }
#map { width: 100%; height: 100%; }
#map_park { display: none; }
.map-chips { position: absolute; left: 8px; bottom: 8px; z-index: 800; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.chip { background: rgba(255,255,255,.92); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--sub); }
.chip.lv-danger { color: var(--danger); }
.leaflet-container { font: inherit; }
.map-label { background: none; border: 0; box-shadow: none; color: #5c5c58; font-size: 11px; padding: 0; }
.map-label.extent { color: var(--ink); font-weight: 600; }
.map-label.frame { color: var(--accent); }
.map-label.topo-miss { color: #5c5c58; font-weight: 600; }
.topo-missing { fill: url(#hatch) !important; fill-opacity: 1 !important; }
/* 대상지 방식 */
.mode-intro { margin: 8px 0 4px; }
.chooser { overflow: auto; flex: 1; min-height: 0; padding-bottom: 12px; }
.hero { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 12px; margin: 4px 0 16px; }
.hero .lead { font-size: 15px; font-weight: 600; line-height: 1.45; margin: 0 0 4px; }
.hero .what { color: var(--sub); font-size: 12px; margin: 0 0 10px; }
.hero ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hero li { background: var(--bg); border-radius: 6px; padding: 6px 8px; font-size: 12px; line-height: 1.35; }
.hero li b { display: block; font-size: 12px; font-weight: 600; }
.hero .src { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
.mode-cards { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.mode-card { text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 3px; }
.mode-card:hover { border-color: var(--accent); background: var(--accent-bg); }
.mode-card b { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.mode-card .last { font-size: 11px; color: var(--accent); font-weight: 400; }
.mode-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.mode-bar b { font-weight: 600; font-size: 13px; }
.area-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.draw-band { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 6px 10px; margin: 6px 0; background: var(--accent-bg); border-radius: 6px; font-size: 12px; }
.draw-band .acts { margin-left: auto; display: flex; gap: 6px; }
.target-line { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; }
.target-line .link { margin-left: auto; }
.leaflet-container.drawing { cursor: crosshair; }
.lot-head { display: flex; align-items: center; height: 32px; margin-top: 8px; gap: 8px; }
.lot-head .total { font-size: 20px; font-weight: 600; line-height: 1.2; }
.lot-head .link { margin-left: auto; }
#lot_rows { max-height: 132px; overflow: auto; }
.chip-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px; border-radius: 6px; cursor: pointer; }
.chip-row:hover, .chip-row:focus-visible { background: var(--accent-bg); }
.chip-row .x { margin-left: auto; background: none; border: 0; color: var(--danger); width: 28px; height: 28px; border-radius: 999px; }
.badge-warn { font-size: 11px; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 0 6px; }

/* ── ② 범위·옵션 ── */
.lot-summary { display: flex; align-items: center; height: 32px; margin-bottom: 8px; gap: 8px; }
.lot-summary .link { margin-left: auto; }
.row { display: flex; align-items: center; min-height: 36px; gap: 8px; }
.row .lbl { width: 36px; flex: none; color: var(--sub); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); cursor: pointer; font-size: 12px; position: relative; }
.seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; left: 0; top: 0; cursor: pointer; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input[type="number"] { position: relative; z-index: 1; opacity: 1; width: 64px; height: 22px; margin: 0 4px 0 0; padding: 0 4px; font-size: 12px; }
.drow { display: flex; align-items: center; min-height: 32px; gap: 8px; }
.drow .sum { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
.disc { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 0 4px; height: 28px; white-space: nowrap; }
.disc-body { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 2px 0 8px 22px; }
.disc-body .row { min-height: 32px; }
.disc-body .lbl { width: 48px; }
.grid13 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.grid13 label { min-height: 26px; font-size: 12px; }
.ds-row { display: flex; align-items: center; min-height: 24px; gap: 8px; font-size: 12px; }
.ds-row .lbl { width: 28px; flex: none; }
.ds-row .extra { margin-left: auto; white-space: nowrap; }
.ds-row.lv-warn .extra { color: var(--warn); } .ds-row.lv-danger .extra { color: var(--danger); } .ds-row.lv-missing .extra { color: var(--sub); }
.ds-ok summary { min-height: 24px; font-size: 12px; color: var(--sub); cursor: pointer; }
details.adv > summary { line-height: 32px; cursor: pointer; font-weight: 600; }
details.adv > summary .sum { margin-left: 8px; }
details.adv > summary .sum { color: var(--sub); font-weight: 400; font-size: 12px; }
details.adv .grp { color: var(--sub); font-size: 12px; margin-top: 6px; }

/* ── 경고 (공통 렌더) ── */
.warn-item { border-left: 3px solid var(--muted); background: var(--surface); margin: 4px 0; font-size: 12px; }
.warn-item.lv-warn { border-color: var(--warn); background: var(--warn-bg); }
.warn-item.lv-danger { border-color: var(--danger); background: var(--danger-bg); }
.warn-item summary, .warn-item .line { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 8px; cursor: pointer; list-style: none; }
.warn-item summary::-webkit-details-marker { display: none; }
.warn-item .line { cursor: default; }
.warn-item .caret { margin-left: auto; color: var(--sub); }
.warn-item .body { padding: 2px 8px 8px 24px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.warn-item.lv-warn .ic { color: var(--warn); } .warn-item.lv-danger .ic { color: var(--danger); } .warn-item.lv-info .ic { color: var(--sub); }

/* ── ③ 결과 ── */
.progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
.prog-meta b { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.phase-list { margin: 12px 0; padding: 0; list-style: none; }
.phase-list li { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.phase-list li .ic { width: 16px; text-align: center; }
.phase-list li .det { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
.phase-list li.st-pending, .phase-list li.st-skipped { color: var(--sub); }
.phase-list li.st-done .ic { color: var(--ok); } .phase-list li.st-running .ic { color: var(--accent); } .phase-list li.st-failed .ic { color: var(--danger); }
.log details summary { font-size: 12px; color: var(--sub); cursor: pointer; line-height: 28px; }
.log pre { margin: 0; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono); font-size: 12px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
.log .lw { color: var(--warn); } .log .le { color: var(--danger); }
.err-card { border: 1px solid var(--danger); border-left-width: 3px; background: var(--danger-bg); border-radius: 6px; padding: 12px; margin: 12px 0; }
.err-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--danger); }
.err-card pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 4px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
.card h4 { margin: 0 0 6px; font-size: 13px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.card .red { color: var(--danger); font-size: 12px; margin-top: 4px; }
.card .ok-line { color: var(--ok); font-size: 12px; }
.done-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; font-size: 16px; font-weight: 600; }
.done-line .ok { color: var(--ok); }
.done-line .link { font-size: 12px; font-weight: 400; font-family: var(--mono); }
.dirty { padding: 6px 12px; margin-bottom: 12px; border-left: 3px solid var(--muted); background: var(--surface); color: var(--sub); font-size: 12px; }
.sheet-list { margin: 8px 0 0; padding: 0; list-style: none; }
.sheet-list li { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 12px; cursor: pointer; padding: 0 4px; border-radius: 4px; }
.sheet-list li:hover { background: var(--bg); }
.sheet-list li.empty { color: var(--muted); cursor: default; }
.sheet-list li .reason { margin-left: auto; }
.q-row { display: grid; grid-template-columns: 60px 1fr; gap: 4px 12px; align-items: center; min-height: 28px; font-size: 12px; }
.q-row .k { color: var(--sub); }
.hbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin-bottom: 2px; }
.hbar span:nth-child(1) { background: var(--bar1); } .hbar span:nth-child(2) { background: var(--bar2); } .hbar span:nth-child(3) { background: var(--bar3); } .hbar span:nth-child(4) { background: var(--bar4); }
details.files summary { line-height: 32px; cursor: pointer; font-weight: 600; }
.file-list { margin: 0; padding: 0; list-style: none; }
.file-list li { display: flex; gap: 8px; min-height: 28px; align-items: center; cursor: pointer; font-family: var(--mono); font-size: 12px; padding: 0 4px; border-radius: 4px; }
.file-list li:hover { background: var(--surface); }
.file-list li .sub { margin-left: auto; font-family: var(--mono); }

/* ── 푸터 ── */
footer { flex: none; height: 64px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border-top: 1px solid var(--border); }
footer.busy .btn { pointer-events: none; color: var(--muted); }
footer .busy-label { color: var(--sub); font-size: 12px; }

@media (max-width: 419px) {
  .badge-date { display: none; }
  .stepper button .t { display: none; }
}
</style>
</head>
<body data-step="1" data-run="idle">
<header>
  <div class="titlebar">
    <h1>대지검토</h1>
    <button id="badges" type="button" data-act="init" title="자료 상태 다시 확인">확인 중…</button>
  </div>
  <ol class="stepper" id="stepper">
    <li><button type="button" data-go="1"><span class="o"></span><span class="t">대상지</span></button></li>
    <li><button type="button" data-go="2"><span class="o"></span><span class="t">범위</span></button></li>
    <li><button type="button" data-go="3"><span class="o"></span><span class="t">옵션</span></button></li>
    <li><button type="button" data-go="4"><span class="o"></span><span class="t">결과</span></button></li>
  </ol>
</header>
<div id="init_warnings"></div>
<main>
  <section data-step="1" aria-label="대상지"></section>
  <section data-step="2" aria-label="범위"></section>
  <section data-step="3" aria-label="옵션"></section>
  <section data-step="4" aria-label="결과"></section>
  <div id="blocker" hidden></div>
</main>
<footer id="footer"></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="phase_live" class="sr-only" aria-live="polite"></div>
<!-- 지도 컨테이너 — ①↔② 슬롯으로 옮겨 다닌다. 재렌더 중에는 여기 둔다 -->
<div id="map_park"><div id="map" tabindex="-1"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#5c5c58" stroke-opacity=".35" stroke-width="2"/>
  </pattern>
</defs></svg>
<!--VENDOR_JS-->
<script>
"use strict";
// ── 브리지 (docs/panel_ui.md) ──
window.__outbox = []; window.__seq = 0;

// ── 지도 ──
function initMap(init) {
  var el = $("map");
  // 지도 위 칩 — 컨테이너 자식이라 슬롯을 옮겨도 따라간다
  var chips = document.createElement("div"); chips.className = "map-chips";
  chips.innerHTML = '<span class="chip" id="chip_zoom" hidden>확대하면 필지가 보입니다</span><span class="chip" id="chip_trunc" hidden>일부만 표시 — 더 확대하세요</span><span class="chip lv-danger" id="chip_offline" hidden>지도 타일을 못 받음(오프라인) — 필지선만 표시</span>';
  el.appendChild(chips);
  map = L.map(el, { preferCanvas: true, zoomControl: false, attributionControl: true }).setView(ll(init.map.center), init.map.zoom);
  el.tabIndex = -1;
  L.control.zoom({ position: "bottomright" }).addTo(map);
  svgRenderer = L.svg();
  tiles = L.tileLayer(init.tile.url, { attribution: init.tile.attribution, maxZoom: 19 }).addTo(map);
  tiles.on("tileerror", function () {
    if (tileDead) return;

    if (tileErrors < 3) return;
    if (!tileFallback && init.tile.fallback_url && init.tile.fallback_url !== init.tile.url) {
      tileFallback = true; tileErrors = 0; tiles.setUrl(init.tile.fallback_url);
      tiles.options.attribution = "© OpenStreetMap contributors"; map.attributionControl.setPrefix("");
    } else { tileDead = true; $("chip_offline").hidden = false; }
  });
  tiles.on("load", function () { tileErrors = 0; });
  map.on("moveend zoomend", function () { if (state.step === 1) debounce("move", 250, requestLots); });
  map.on("click", function (e) {
    if (state.step !== 1 || state.run === "running") return;
    if (draw.on) { draw.pts.push(e.latlng); redrawDraw(e.latlng); renderAreaInfo(); return; }
    if (state.mode === "point") send({ cmd: "set_point", center: [e.latlng.lng, e.latlng.lat] });
  });

}
function requestLots() {

// 지도 컨테이너를 현재 단계 슬롯으로

  slot.appendChild(el);

  preflight_result: function (m) {
    if (m.seq < state.seq.preflight) return;
    state.preflight = m;
    renderEstimate(); renderDataStatus(); drawPreflightLayers(m); renderFooter();
    var de = $("data_status_err"); if (de) de.innerHTML = "";
  },
  progress: function (m) {
    m = state.progress = Object.assign({}, state.progress, m);
    if (m.state === "failed" || m.state === "cancelled") {
      clearInterval(timers.elapsed); state.run = m.state;
      renderResult(); setRun(m.state); announce(m.state === "cancelled" ? "취소됨" : "생성 실패 — " + ((m.error && m.error.title) || ""));
      return;
    }
    if (state.run !== "running") return;
    var bar = $("progress_bar"); if (bar) { bar.setAttribute("aria-valuenow", m.percent); bar.firstChild.style.width = m.percent + "%"; }
    var pc = $("percent"); if (pc) pc.textContent = m.percent;
    renderPhaseList(); updateCancelBtn();
  },
  log: function (m) { appendLog(m.text, m.level); },
  busy: function (m) { state.busy = !!m.on; state.busyLabel = m.label || ""; updateCancelBtn(); },
  done: function (m) {
    clearInterval(timers.elapsed);
    state.result = m; m.basemap = m.basemap || { ready: false, exported: [] }; m.basemap.exported = m.basemap.exported || [];
    state.dirty = !sameOpts(m.options || {}, state.options);
    state.run = "done"; state.maxReached = 4; state.step = 4; render();
    setQaLayer(m.qa_geojson);
    announce("생성 완료, 경고 " + (m.warnings || []).length + "건");
  },
  imported: function (m) {
    if (state.run === "running") return;   // import_after 경로 — done.context로 그린다
    applyImported(!!m.ok, m.text, m.layers, m.objects);
  },
  exported: function (m) {
    if (!state.result) return;
    if (m.ok) { var ex = state.result.basemap.exported; if (ex.indexOf(m.path) < 0) ex.push(m.path); renderExportedList(); toast(m.path.split("/").pop() + " 내보냈습니다"); }
    else slotError("bm_err", (m.text || "내보내기 실패") + " — log.txt 확인");
  },
  error: function (m) {
    appendLog("✗ " + m.context + ": " + m.text + (m.detail ? "\n" + m.detail : ""), "error");
    var text = m.text || "오류";
    switch (m.context) {
      case "generate": if (state.run === "running") { handlers.progress({ state: "failed", phase: state.progress ? state.progress.phase : "query", phase_status: state.progress ? state.progress.phase_status : {}, phase_detail: {}, percent: 0, error: { title: text, detail: m.detail || "", code: "exception" } }); } else showErrorBand(text); break;
      case "import": var dc = $("doc_status"); if (dc) dc.innerHTML = docStatusHtml(false, text, state.result && state.result.context.path); else showErrorBand(text); break;
      case "export": slotError("bm_err", text); break;
      case "search": slotError("search_msg", text); break;
      case "select": slotError(state.mode === "area" ? "area_err" : "lot_err", text); break;
      case "preflight": if (state.step === 1 && state.mode === "area") { slotError("area_err", text); break; } slotError("data_status_err", "확인 실패 — " + text); break;
      default: showErrorBand(text);
    }
  }
};
window.app = { receive: function (msg) { var h = handlers[msg && msg.type]; if (h) h(msg); else console.warn("모르는 푸시", msg); } };

// ── 목 모드 (?mock=1) — Rhino 없이 브라우저에서 ──
var MOCK = /[?&]mock=1/.test(location.search);
if (MOCK) {
  var lastPf = null;
  send = function (msg) {   // 콘솔로. preflight만 마지막 결과를 새 seq로 되돌려 준다
    console.log("[send]", JSON.stringify(msg));
    if (msg.cmd === "preflight" && lastPf) setTimeout(function () { window.app.receive(Object.assign({}, lastPf, { seq: msg.seq })); }, 50);
  };
  var upto = +((location.search.match(/[?&]step=(\d)/) || [])[1] || 4);
  var onlyN = +((location.search.match(/[?&]n=(\d+)/) || [])[1] || 0);
  var w = (location.search.match(/[?&]w=(\d+)/) || [])[1]; if (w) document.documentElement.style.width = w + "px";
  var playMock = function (msgs) {
    var skip = { progress: 1, log: 1, busy: 1, imported: 1, done: 1, exported: 1 };
    msgs = msgs.filter(function (m) { return upto >= 4 || !skip[m.type]; });
    state.mode = state.mode || "lots";   // 목 데이터는 필지 방식
    if (onlyN) msgs = msgs.slice(0, onlyN);
    var i = 0;
    var tick = function () {
      if (i >= msgs.length) { if (upto === 2 && state.step === 1) go(2); return; }
      var m = msgs[i++];
      if (m.type === "preflight_result") { lastPf = m; m = Object.assign({}, m, { seq: state.seq.preflight }); }
      if ((m.type === "progress" || m.type === "log") && state.run !== "running") startGenerate();
      window.app.receive(m);
      setTimeout(tick, 300);
    };
    tick();
  };
  var loadMock = function () {
    var inline = $("mock");
    if (inline) { playMock(JSON.parse(inline.textContent)); return; }
    fetch("../tests/fixtures/site_ui_mock.json").then(function (r) { return r.json(); }).then(playMock)
      .catch(function (e) { console.error("목 데이터 로드 실패 — Chrome은 --allow-file-access-from-files 필요", e); });
  };
  var css = document.createElement("link"); css.rel = "stylesheet"; css.href = "./vendor/leaflet.css"; document.head.appendChild(css);
  var js = document.createElement("script"); js.src = "./vendor/leaflet.js"; js.onload = loadMock; document.body.appendChild(js);
} else {
  send({ cmd: "init" });
}
</script>
