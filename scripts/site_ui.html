<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대지검토</title>
<!--VENDOR_CSS-->
<style>
/* 번들 폰트 — 호스트가 base64 data URI로 치환 */
@font-face {
  font-family: "Pretendard Variable";
  src: url("<!--FONT_WOFF2-->") format("woff2-variations");
  font-weight: 45 920;
  font-display: swap;
}
/* ── 토큰 (DESIGN.md — 방안지 위의 구성 격자: 8 px 모눈, 1 px 사각 괘선, 블루 하나) ── */
:root {
  --bg: #f5f7fa; --grid: #e4eaf2; --surface: #fff; --border: #c9d2de; --rule: #111418; --line: #a9c0f2;
  --ink: #111418; --sub: #465061; --muted: #7d8798;
  --accent: #0057ff; --accent-dn: #0044cc; --accent-ink: #0047d6; --accent-bg: #e9f0ff;
  --ok: #1f7a4d; --warn: #a8460b; --warn-bg: #fff4e5; --danger: #c43c3c; --danger-bg: #fdeaea;
  --bar1: #111418; --bar2: #465061; --bar3: #7d8798; --bar4: #c9d2de;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  font: 400 13px/1.5 "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  overflow: hidden;
}
::selection { background: var(--accent-bg); color: var(--ink); }
input, textarea { caret-color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2:focus-visible { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.hint { color: var(--sub); font-size: 12px; }
.sub { color: var(--sub); font-weight: 400; font-size: 12px; }
h2 { font-size: 15px; font-weight: 600; line-height: 1.3; margin: 0 0 8px; }
h3 { font-size: 13px; font-weight: 600; line-height: 16px; margin: 16px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--accent-ink); display: flex; align-items: center; gap: 8px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: square; vertical-align: -3px; }
.ico.fill { fill: currentColor; stroke: none; }

/* ── 헤더 ── */
header { flex: none; padding: 8px 16px 12px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.titlebar { height: 32px; display: flex; align-items: center; justify-content: space-between; }
.titlebar h1 { font-size: 16px; font-weight: 700; margin: 0; line-height: 32px; }
/* 자료 날짜 + 더보기 — 누르면 메뉴 */
#menu_btn { display: flex; gap: 8px; align-items: center; height: 32px; padding: 0 8px; font-size: 12px; color: var(--sub); background: none; border: 1px solid transparent; }
#menu_btn:hover { border-color: var(--border); color: var(--ink); }
#menu_btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent-ink); }
#badges { display: flex; gap: 6px; align-items: center; }
#menu_btn .bar { width: 1px; height: 16px; background: var(--border); }
.dot { display: inline-block; width: 8px; height: 8px; vertical-align: middle; }
.dot.lv-ok { background: var(--ok); } .dot.lv-warn { background: var(--warn); } .dot.lv-danger { background: var(--danger); } .dot.lv-missing { background: var(--muted); }
.stepper { margin: 4px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); }
.stepper li { display: flex; min-width: 0; border-left: 1px solid var(--rule); }
.stepper li:first-child { border-left: 0; }
.stepper button { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0 10px; height: 32px; color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; }
.stepper button .o { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.stepper button:hover:not(:disabled):not([aria-current]) { background: var(--accent-bg); color: var(--ink); }
.stepper button[aria-current] { background: var(--accent); color: #fff; font-weight: 600; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
.stepper button[aria-current] .o { color: #fff; }
.stepper button.done { color: var(--ink); }
.stepper button.done .o { color: var(--accent-ink); }
.stepper button:disabled { color: var(--muted); }

/* ── 띠·블로커·토스트 ── */
#init_warnings:empty { display: none; }
.band { padding: 6px 12px; margin: 8px 16px 0; border: 1px solid var(--border); background: var(--surface); font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }
.band.lv-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.band.lv-danger { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.band.lv-info { color: var(--sub); }
.band .btn { margin-left: auto; flex: none; }
#blocker { position: absolute; inset: 0; background: var(--bg); padding: 24px 16px; z-index: 1000; overflow: auto; }
#blocker h2 { margin-bottom: 16px; }
.check-list { display: grid; grid-template-columns: 1.4em 7em 1fr; gap: 4px 8px; margin-bottom: 16px; }
.check-list .ok { color: var(--ok); } .check-list .bad { color: var(--danger); } .check-list .opt { color: var(--muted); }
/* 더보기 메뉴 — 헤더 괘선 아래로 내려오는 흰 면. 어느 단계에도 안 맞는 것(최근 대상지·자료·키·폴더)을 모은다 */
#menu { position: absolute; top: 0; left: 0; right: 0; max-height: 100%; overflow: auto; z-index: 1100; background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0 16px 16px; }
#menu h3:first-child { border-top: 0; margin-top: 0; }
.mrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 32px; border-top: 1px solid var(--border); font-size: 12px; }
.mrow:first-of-type { border-top: 0; }
.mrow .k { color: var(--sub); display: flex; align-items: center; gap: 6px; }
.mrow .v { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist { border: 1px solid var(--border); }
.mlist .mrow { padding: 0 8px; }
.recent { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; color: var(--ink); }
.recent:first-child { border-top: 0; }
.recent:hover:not(:disabled) { background: var(--accent-bg); color: var(--accent-ink); }
.recent:disabled { color: var(--muted); }
.recent span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-acts { display: flex; gap: 8px; margin-top: 8px; }
.menu-ver { margin: 16px 0 0; color: var(--muted); font-size: 11px; }
#toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; font-size: 12px; z-index: 60; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.show { opacity: 1; }

/* ── 본문·섹션 — 방안지 바탕 ── */
main { flex: 1; min-height: 0; position: relative; overflow: hidden;
  background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px; background-position: -1px -1px; }
section { display: none; height: 100%; }
body[data-step="1"] section[data-step="1"], body[data-step="2"] section[data-step="2"] { display: flex; flex-direction: column; padding: 8px 16px 0; }
/* 옵션·결과는 넓은 창에서도 내용 폭 880 px까지만(가운데) — 스크롤은 창 전체 */
body[data-step="3"] section[data-step="3"], body[data-step="4"] section[data-step="4"] { display: block; overflow: auto; padding: 8px max(16px, calc((100% - 880px) / 2)) 16px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: contents; }
body[data-run="running"] section[data-step="1"], body[data-run="running"] section[data-step="2"], body[data-run="running"] section[data-step="3"] { pointer-events: none; }
section[data-step="1"] fieldset, section[data-step="2"] fieldset { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.range-controls { flex: none; padding: 8px 0; }
.range-controls .row { min-height: 40px; }

/* ── 버튼·입력 ── */
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--rule); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-dn); border-color: var(--accent-dn); color: #fff; }
.btn.go::after { content: ""; width: 12px; height: 12px; flex: none; background: linear-gradient(to bottom right, transparent calc(50% - .8px), currentColor calc(50% - .8px), currentColor calc(50% + .8px), transparent calc(50% + .8px)); }
.btn.ghost { border-color: transparent; background: none; color: var(--sub); padding: 0 8px; }
.btn.ghost:hover:not(:disabled) { border-color: transparent; color: var(--accent-ink); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { color: var(--muted); border-color: var(--border); background: var(--surface); }
.btn.primary:disabled { background: var(--border); border-color: var(--border); color: #fff; }
.btn small { font-size: 11px; color: var(--sub); font-weight: 400; }
.btn.primary small { color: rgba(255,255,255,.85); }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { color: var(--muted); text-decoration: none; }
.danger-text { color: var(--danger); }
input[type="text"], input[type="search"], input[type="number"], select { height: 32px; padding: 0 8px; border: 1px solid var(--border); background: var(--surface); }
input[type="text"]:hover, input[type="number"]:hover, select:hover { border-color: var(--muted); }
input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
input[type="number"].sm, select.sm { height: 28px; padding: 0 6px; font-size: 12px; }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; margin: 0 8px 0 0; accent-color: var(--accent); vertical-align: -3px; }
label.chk { display: flex; align-items: center; min-height: 32px; }

/* ── ① 대상지 — 지도가 첫 화면. 위 도구줄(방식 칸 + 검색), 아래 트레이(고른 것·방식 도구) ── */
.toolrow { display: flex; gap: 8px; position: relative; margin-bottom: 8px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex: none; width: 208px; border: 1px solid var(--rule); background: var(--surface); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-left: 1px solid var(--rule); background: none; color: var(--sub); font-size: 12px; white-space: nowrap; }
.modes button:first-child { border-left: 0; }
.modes button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--accent-bg); color: var(--ink); }
.modes button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-ink); font-weight: 600; }
.modes button:disabled { color: var(--border); }
.search { display: flex; flex: 1; min-width: 0; }
.search input { flex: 1; min-width: 0; }
.search .btn { width: 32px; padding: 0; justify-content: center; margin-left: -1px; }
#search_msg { min-height: 18px; margin: -4px 0 4px; }
#search_msg:empty { min-height: 0; margin: 0; }
#search_list { position: absolute; top: 36px; left: 0; right: 0; z-index: 20; margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--rule); max-height: 264px; overflow: auto; }
#search_list li { height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; border-top: 1px solid var(--border); }
#search_list li:first-child { border-top: 0; }
#search_list li .sub { margin-left: auto; white-space: nowrap; }
#search_list li[aria-selected="true"], #search_list li:hover { background: var(--accent-bg); }
.map-slot { position: relative; isolation: isolate; border: 1px solid var(--rule); overflow: hidden; background: #e9ecef; }
.map-slot-1 { flex: 1; min-height: 200px; }
.map-slot-2 { flex: 1; min-height: 320px; }
#map { width: 100%; height: 100%; }
#map_park { display: none; }
.map-chips { position: absolute; left: 8px; bottom: 8px; z-index: 800; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.chip { background: rgba(255,255,255,.94); border: 1px solid var(--border); padding: 2px 8px; font-size: 12px; color: var(--sub); }
.chip.lv-danger { color: var(--danger); }
.leaflet-container { font: inherit; }
.leaflet-bar a { border-radius: 0 !important; }
.map-label { background: none; border: 0; box-shadow: none; color: #5c5c58; font-size: 11px; padding: 0; }
.map-label.extent { color: var(--ink); font-weight: 600; }
.map-label.frame { color: var(--accent-ink); }
.map-label.topo-miss { color: #5c5c58; font-weight: 600; }
.topo-missing { fill: url(#hatch) !important; fill-opacity: 1 !important; }
.tray { flex: none; padding-bottom: 8px; }
.area-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.draw-band { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 6px 10px; margin: 8px 0; background: var(--accent-bg); border: 1px solid var(--line); font-size: 12px; }
.draw-band .acts { margin-left: auto; display: flex; gap: 8px; }
.target-line { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; }
.target-line .link { margin-left: auto; }
.leaflet-container.drawing { cursor: crosshair; }
.lot-head { display: flex; align-items: center; height: 32px; margin-top: 8px; gap: 8px; }
.lot-head .total { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.lot-head .link { margin-left: auto; }
#lot_rows { max-height: 136px; overflow: auto; border: 1px solid var(--border); background: var(--surface); }
.chip-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 8px; cursor: pointer; border-top: 1px solid var(--border); }
.chip-row:first-child { border-top: 0; }
.chip-row:hover, .chip-row:focus-visible { background: var(--accent-bg); }
.chip-row .x { margin-left: auto; background: none; border: 0; color: var(--sub); width: 28px; height: 28px; display: grid; place-content: center; }
.chip-row .x:hover { color: var(--danger); }
.badge-warn { font-size: 11px; color: var(--warn); background: var(--warn-bg); padding: 0 4px; display: inline-flex; align-items: center; gap: 2px; }

/* ── ② 범위·옵션 ── */
.lot-summary { display: flex; align-items: center; height: 32px; margin-bottom: 8px; gap: 8px; }
.lot-summary .link { margin-left: auto; }
.row { display: flex; align-items: center; min-height: 40px; gap: 8px; }
.row .lbl { width: 36px; flex: none; color: var(--sub); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; position: relative; color: var(--sub); }
.seg label:hover { border-color: var(--muted); color: var(--ink); }
.seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; left: 0; top: 0; cursor: pointer; }
.seg label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input[type="number"] { position: relative; z-index: 1; opacity: 1; width: 64px; height: 24px; margin: 0 4px 0 0; padding: 0 4px; font-size: 12px; }
.drow { display: flex; align-items: center; min-height: 32px; gap: 8px; }
.drow .sum { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
.disc { background: none; border: 0; color: var(--accent-ink); font-size: 12px; padding: 0 4px; height: 28px; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.disc .ico { transition: transform .15s; }
.disc[aria-expanded="true"] .ico { transform: rotate(180deg); }
.disc-body { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin: 2px 0 8px 24px; }
.disc-body .row { min-height: 32px; }
.disc-body .lbl { width: 48px; }
.grid13 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.grid13 label { min-height: 28px; font-size: 12px; }
.ds-row { display: flex; align-items: center; min-height: 24px; gap: 8px; font-size: 12px; }
.ds-row .lbl { width: 28px; flex: none; }
.ds-row .extra { margin-left: auto; white-space: nowrap; }
.ds-row.lv-warn .extra { color: var(--warn); } .ds-row.lv-danger .extra { color: var(--danger); } .ds-row.lv-missing .extra { color: var(--sub); }
.ds-ok summary { min-height: 24px; font-size: 12px; color: var(--sub); cursor: pointer; }
details.adv { margin-top: 16px; border-top: 1px solid var(--line); }
details.adv > summary { line-height: 40px; cursor: pointer; font-weight: 600; color: var(--accent-ink); }
details.adv > summary .sum { margin-left: 8px; color: var(--sub); font-weight: 400; font-size: 12px; }
details.adv .grp { color: var(--sub); font-size: 12px; margin-top: 8px; }
.style-pick { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.style-pick select { flex: 1; min-width: 0; }

/* ── 경고 (공통 렌더) ── */
.warn-item { border: 1px solid var(--border); background: var(--surface); margin: 4px 0; font-size: 12px; }
.warn-item.lv-warn { border-color: var(--warn); background: var(--warn-bg); }
.warn-item.lv-danger { border-color: var(--danger); background: var(--danger-bg); }
.warn-item summary, .warn-item .line { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 8px; cursor: pointer; list-style: none; }
.warn-item summary::-webkit-details-marker { display: none; }
.warn-item .line { cursor: default; }
.warn-item .caret { margin-left: auto; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; }
.warn-item[open] .caret > .ico:last-child { transform: rotate(90deg); }
.warn-item .body { padding: 2px 8px 8px 32px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.warn-item .ic { display: inline-flex; }
.warn-item.lv-warn .ic { color: var(--warn); } .warn-item.lv-danger .ic { color: var(--danger); } .warn-item.lv-info .ic { color: var(--sub); }

/* ── ③ 결과 ── */
.progress { height: 8px; background: var(--surface); border: 1px solid var(--rule); margin: 8px 0 4px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
.prog-meta b { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.phase-list { margin: 12px 0; padding: 0; list-style: none; border: 1px solid var(--border); background: var(--surface); }
.phase-list li { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-top: 1px solid var(--border); }
.phase-list li:first-child { border-top: 0; }
.phase-list li .ic { width: 16px; display: inline-flex; }
.phase-list li .det { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
.phase-list li.st-pending, .phase-list li.st-skipped { color: var(--sub); }
.phase-list li.st-done .ic { color: var(--ok); } .phase-list li.st-running .ic { color: var(--accent); } .phase-list li.st-failed .ic { color: var(--danger); }
.log details summary { font-size: 12px; color: var(--sub); cursor: pointer; line-height: 28px; }
.log pre { margin: 0; padding: 8px; background: var(--surface); border: 1px solid var(--border); font-family: var(--mono); font-size: 12px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
.log .lw { color: var(--warn); } .log .le { color: var(--danger); }
.err-card { border: 1px solid var(--danger); background: var(--danger-bg); padding: 12px; margin: 12px 0; }
.err-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--danger); }
.err-card pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 4px 0; }
.card { background: var(--surface); border: 1px solid var(--rule); margin-bottom: 12px; }
.card > .top { padding: 12px; display: grid; gap: 4px; }
.card h4 { margin: 0; font-size: 15px; font-weight: 600; line-height: 20px; display: flex; align-items: baseline; gap: 8px; }
.card h4 .sub { margin-left: auto; }

    if (state.mode === "lots" && state.lotState && state.init) {   // 메뉴의 최근 대상지 — Python이 prefs에 넣는 것(site_prefs.add_recent)과 같은 꼴로 앞에 넣는다
      var key = state.lots.slice().sort().join();
      state.init.recent = [{ pnus: state.lots.slice(), label: String(m.lot_name || "").replace(/_/g, " "), total_area: state.lotState.total_area, date: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) }]
        .concat((state.init.recent || []).filter(function (r) { return r.pnus.slice().sort().join() !== key; })).slice(0, 5);
    }
    announce("생성 완료, 경고 " + (m.warnings || []).length + "건");
  },
  imported: function (m) {
    if (state.run === "running") return;   // import_after 경로 — done.context로 그린다
    applyImported(!!m.ok, m.text, m.layers, m.objects);
  },
  exported: function (m) {
    if (!state.result) return;
    if (m.ok) { var ex = state.result.basemap.exported; if (ex.indexOf(m.path) < 0) ex.push(m.path); renderExportedList(); toast(m.path.split("/").pop() + " 내보냈습니다"); }
    else slotError("bm_err", (m.text || "내보내기 실패") + " — log.txt 확인");
  },
  error: function (m) {
    appendLog("오류 " + m.context + ": " + m.text + (m.detail ? "\n" + m.detail : ""), "error");
    var text = m.text || "오류";
    switch (m.context) {
      case "generate": if (state.run === "running") { handlers.progress({ state: "failed", phase: state.progress ? state.progress.phase : "query", phase_status: state.progress ? state.progress.phase_status : {}, phase_detail: {}, percent: 0, error: { title: text, detail: m.detail || "", code: "exception" } }); } else showErrorBand(text); break;
      case "import": var dc = $("doc_status"); if (dc) dc.innerHTML = docStatusHtml(false, text, state.result && state.result.context.path); else showErrorBand(text); break;
      case "export": slotError("bm_err", text); break;
      case "style": if ($("st_msg")) $("st_msg").textContent = text; else showErrorBand(text); var w = $("st_wait"); if (w) w.hidden = true; break;
      case "search": slotError("search_msg", text); break;
      case "select": slotError(state.mode === "area" ? "area_err" : "lot_err", text); break;
      case "preflight": if (state.step === 1 && state.mode === "area") { slotError("area_err", text); break; } slotError("data_status_err", "확인 실패 — " + text); break;
      default: showErrorBand(text);
    }
  }
};
window.app = { receive: function (msg) { var h = handlers[msg && msg.type]; if (h) h(msg); else console.warn("모르는 푸시", msg); } };

// ── 목 모드 (?mock=1) — Rhino 없이 브라우저에서 ──
var MOCK = /[?&]mock=1/.test(location.search);
if (MOCK) {
  var lastPf = null;
  send = function (msg) {   // 콘솔로. preflight만 마지막 결과를 새 seq로 되돌려 준다
    console.log("[send]", JSON.stringify(msg));
    if (msg.cmd === "preflight" && lastPf) setTimeout(function () { window.app.receive(Object.assign({}, lastPf, { seq: msg.seq })); }, 50);
  };
  var upto = +((location.search.match(/[?&]step=(\d)/) || [])[1] || 4);
  var onlyN = +((location.search.match(/[?&]n=(\d+)/) || [])[1] || 0);
  var w = (location.search.match(/[?&]w=(\d+)/) || [])[1]; if (w) document.documentElement.style.width = w + "px";
  var playMock = function (msgs) {
    var skip = { progress: 1, log: 1, busy: 1, imported: 1, done: 1, exported: 1 };
    msgs = msgs.filter(function (m) { return upto >= 4 || !skip[m.type]; });
    state.mode = state.mode || "lots";   // 목 데이터는 필지 방식
    if (onlyN) msgs = msgs.slice(0, onlyN);
    var i = 0;
    var tick = function () {
      if (i >= msgs.length) { if (upto === 2 && state.step === 1) go(2); if (/[?&]menu=1/.test(location.search)) openMenu(); return; }
      var m = msgs[i++];
      if (m.type === "preflight_result") { lastPf = m; m = Object.assign({}, m, { seq: state.seq.preflight }); }
      if ((m.type === "progress" || m.type === "log") && state.run !== "running") startGenerate();
      window.app.receive(m);
      setTimeout(tick, 300);
    };
    tick();
  };
  var loadMock = function () {
    var inline = $("mock");
    if (inline) { playMock(JSON.parse(inline.textContent)); return; }
    fetch("../tests/fixtures/site_ui_mock.json").then(function (r) { return r.json(); }).then(playMock)
      .catch(function (e) { console.error("목 데이터 로드 실패 — Chrome은 --allow-file-access-from-files 필요", e); });
  };
  var css = document.createElement("link"); css.rel = "stylesheet"; css.href = "./vendor/leaflet.css"; document.head.appendChild(css);
  var js = document.createElement("script"); js.src = "./vendor/leaflet.js"; js.onload = loadMock; document.body.appendChild(js);
} else {
  send({ cmd: "init" });
}
</script>
