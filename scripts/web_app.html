<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani 웹 — 대지 주변 3D를 브라우저에서</title>
<meta name="description" content="설치 없이 브라우저에서 대상지 주변 건물·도로·지형을 3D로 만들고 GLB·베이스맵·현황도를 받습니다.">
<style>
/* DESIGN.md 방안지 격자 — 패널(iframe)과 같은 값 */
:root { --paper:#F5F7FA; --grid:#E4EAF2; --surface:#FFFFFF; --ink:#111418; --ink-2:#465061; --ink-3:#7D8798; --hair:#C9D2DE; --rule:#111418; --blue:#0057FF; --blue-ink:#0047D6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.5 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--paper); }
.app { display: grid; grid-template-columns: 480px 1fr; height: 100vh; }
#panel { width: 480px; height: 100vh; border: 0; border-right: 1px solid var(--rule); background: var(--paper); }
.view { position: relative; overflow: hidden; min-height: 320px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px; }
.view canvas { position: absolute; inset: 0; display: block; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; color: var(--ink-3); pointer-events: none; }
.empty b { color: var(--ink); font-size: 15px; font-weight: 600; }
.bar { position: absolute; left: 16px; top: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none; }
.bar > * { pointer-events: auto; }
.cells { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); }
.cell { height: 32px; padding: 0 8px; border: 0; border-right: 1px solid var(--hair); background: var(--surface); color: var(--ink-3); font: inherit; cursor: pointer; }
.cell:last-child { border-right: 0; }
.cell[aria-pressed="true"] { color: var(--blue-ink); box-shadow: inset 0 0 0 2px var(--blue); }
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.btn:hover { border-color: var(--blue); color: var(--blue-ink); }
.btn[hidden], .cells[hidden] { display: none; }
.spacer { flex: 1; }
.status { position: absolute; left: 16px; bottom: 16px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hair); padding: 4px 8px; }
.status:empty { display: none; }
.hint { position: absolute; right: 16px; bottom: 16px; font-size: 11px; color: var(--ink-3); }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 100vh 70vh; height: auto; }
  #panel { width: 100%; border-right: 0; border-bottom: 1px solid var(--rule); }
}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
</head>
<body>
<div class="app">
  <iframe id="panel" title="Gorani 패널"></iframe>
  <main class="view" id="view" aria-label="3D 모델">
    <div class="empty" id="empty"><b>생성하면 여기에 3D 모델이 나옵니다</b><span>처음 한 번 엔진을 받습니다(약 20 MB). PC의 Chrome·Edge에서 반경 2 km까지 됩니다.</span></div>
    <div class="bar">
      <div class="cells" id="layers" role="group" aria-label="레이어" hidden></div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="save_glb" hidden>context.glb 받기</button>
      <button type="button" class="btn" id="save_zip" hidden>결과 zip 받기</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <div class="hint">끌기 회전 · 오른쪽 끌기 이동 · 휠 확대</div>
  </main>
</div>
<script type="module">
// Gorani 웹판 페이지 — 패널(iframe panel.html?web=1)과 엔진 워커(web_worker.js) 사이를 잇고 결과 GLB를 그린다. 메시지는 web_worker.js 머리말.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const PREFS_KEY = "gorani.prefs";   // ~/.gorani 파일들(설정·최근 대상지·설치 ID)
const LAYER_LABELS = { Buildings: "건물", Terrain: "지형", Roads: "도로", Water: "수계", Green: "녹지", Rail: "철도", Bridges: "교량",
  Site: "대상지", Parcels: "필지", Ref: "범위", Zoning: "용도지역", "Site::ground": "대상지 바닥", "Terrain::site_flat": "대상지 평탄면",
  "Terrain::site_wall": "대상지 옹벽", "Roads::centerline": "도로 중심선" };
const IS_LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);   // 로컬 시험만 ?manifest= 로 팩 주소를 바꾼다
const $ = (id) => document.getElementById(id);
const panel = $("panel");

// ── 패널 ↔ 워커 ──
let worker = null, busy = 0, lastDir = "", panelReady = false;
const toPanel = [];
function receive(msg) { if (panelReady) panel.contentWindow.app.receive(msg); else toPanel.push(msg); }
function status(text) { $("status").textContent = text || ""; }

function startWorker() {
  busy = 0;
  worker = new Worker("web_worker.js");
  worker.onmessage = (e) => onWorker(e.data);
  const manifest = IS_LOCAL ? new URLSearchParams(location.search).get("manifest") || "" : "";
  worker.postMessage({ boot: { scripts: "scripts.zip", files: JSON.parse(localStorage.getItem(PREFS_KEY) || "{}"), manifest } });
}

function restart() {   // 생성·받기는 워커 안에서 동기라 멈추려면 워커를 새로 띄운다
  worker.terminate();
  receive({ type: "data_progress", done: true, ok: false, text: "받기를 멈췄습니다", in_generate: false });
  receive({ type: "error", context: "generate", text: "멈췄습니다 — 엔진을 다시 띄웁니다(받아 둔 지역 데이터는 다시 받습니다)", detail: "" });
  receive({ type: "busy", on: false, label: "" });
  startWorker();
}

function onWorker(m) {
  switch (m.type) {
    case "web_boot": status(m.text); return;
    case "web_idle": busy = Math.max(0, busy - 1); return;
    case "web_persist": localStorage.setItem(PREFS_KEY, JSON.stringify(m.files)); return;
    case "web_model": showModel(m.bytes.buffer); return;
    case "web_open":
      if (m.url) window.open(m.url, "_blank", "noopener");
      else if (m.view) showModel(m.bytes.buffer);
      else download(m.bytes, m.name);
      return;
    case "done": lastDir = m.dir || lastDir; break;
  }
  receive(m);
}

window.addEventListener("message", (e) => {
  if (e.source !== panel.contentWindow || !e.data || !e.data.gorani) return;
  const cmd = e.data.gorani;
  if (cmd.cmd === "cancel" && busy > 0) { restart(); return; }
  busy++;
  worker.postMessage({ cmd });
});
window.addEventListener("beforeunload", (e) => { if (busy > 0) e.preventDefault(); });
panel.addEventListener("load", () => { panelReady = true; toPanel.splice(0).forEach(receive); });
startWorker();
panel.src = "panel.html?web=1";   // 듣기를 건 뒤에 연다 — 패널이 열리자마자 init을 보낸다

function download(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes]));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ── 3D 뷰어 ──
const view = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3b2, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(0.5, 1.0, 0.7);   // 남동쪽 위(glTF −Z = 북)
scene.add(sun);
const render = () => renderer.render(scene, camera);
controls.addEventListener("change", render);
new ResizeObserver(() => {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix(); render();
}).observe(view);

let model = null, modelBytes = null;
function showModel(buffer) {
  modelBytes = buffer;
  new GLTFLoader().parse(buffer.slice(0), "", (gltf) => {
    if (model) { scene.remove(model); model.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
    model = gltf.scene;
    scene.add(model);
    fit(); renderLayers(); render();
    $("empty").hidden = true; $("save_glb").hidden = false; $("save_zip").hidden = !lastDir;
    window.__gorani_model = { nodes: model.children.map((o) => o.userData.name || o.name), bytes: buffer.byteLength };   // 시험용
  }, (err) => status("모델을 읽지 못했습니다: " + err.message));
}

function fit() {
  const terrain = model.children.find((o) => (o.userData.name || "") === "CTX::Terrain");
  const box = new THREE.Box3().setFromObject(terrain || model);
  const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.near = size / 1000; camera.far = size * 20; camera.updateProjectionMatrix();
  camera.position.copy(center).add(new THREE.Vector3(0.55, 0.6, 0.85).normalize().multiplyScalar(size * 0.9));
  controls.update();
}

function renderLayers() {
  const box = $("layers");
  box.innerHTML = "";
  for (const node of model.children) {
    const path = (node.userData.name || node.name).replace(/^CTX::/, "");
    const head = LAYER_LABELS[path.split("::")[0]];
    const label = LAYER_LABELS[path] || (head ? head + "·" + path.split("::").pop() : path);
    const cell = Object.assign(document.createElement("button"), { type: "button", className: "cell", textContent: label });
    cell.setAttribute("aria-pressed", "true");
    cell.onclick = () => { node.visible = !node.visible; cell.setAttribute("aria-pressed", String(node.visible)); render(); };
    box.appendChild(cell);
  }
  box.hidden = false;
}

$("save_glb").onclick = () => modelBytes && download(new Uint8Array(modelBytes), "context.glb");
$("save_zip").onclick = () => { if (lastDir) { busy++; worker.postMessage({ cmd: { cmd: "open_path", path: lastDir } }); } };
</script>
</body>
</html>
