<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorani 관리</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<style>
@font-face { font-family: "Pretendard Variable"; src: url("/vendor/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
/* 대시보드 토큰 — 차트 색은 dataviz 기본 팔레트 1~3번(검증: validate_palette.js, 흰 바탕·어두운 바탕 통과). 상태색은 따로 둔다 */
:root {
  --paper: #f3f5f8; --surface: #ffffff; --sunk: #f6f7f9; --line: #e7eaef; --line-2: #d4d9e1; --grid: #edf0f3;
  --ink: #111418; --ink-2: #4a5260; --ink-3: #7d8798; --hover: #f0f2f5; --press: #e5e8ed;
  --on-ink: #ffffff; --ink-hover: #2b3038;
  --lime: #d6f5a3; --lime-2: #c4ec84; --lime-ink: #1d2e05;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s1-wash: rgba(42, 120, 214, .10);
  --r250: #86b6ef; --r350: #5598e7; --r450: #2a78d6; --r550: #1c5cab; --r650: #104281;   /* 깔때기 — 파랑 서열 램프(바탕에 가까운 끝이 2:1 넘게 250부터) */
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --critical-ink: #b02a2a;
  --info: #2a78d6; --warn-wash: #fff6ea; --warn-ink: #a8460b; --danger-wash: #fdeeee;
  --accent: #0057ff; --accent-ink: #0047d6; --accent-wash: #e9f0ff; --ring: rgba(0, 87, 255, .35);
  --ok: #1f7a4d; --danger: #c43c3c; --warn: #a8460b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0c1016; --surface: #151b23; --sunk: #11161d; --line: #262e39; --line-2: #38424f; --grid: #1f2630;
    --ink: #e8ecf2; --ink-2: #a9b3c3; --ink-3: #7f8a9c; --hover: #1c232d; --press: #252d38;
    --on-ink: #111418; --ink-hover: #d3d9e2;
    --lime: #33461a; --lime-2: #415a20; --lime-ink: #e6f7c8;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s1-wash: rgba(57, 135, 229, .14);
    --r250: #184f95; --r350: #1c5cab; --r450: #2a78d6; --r550: #5598e7; --r650: #86b6ef;
    --good-ink: #0ca30c; --critical-ink: #e66767; --warn-wash: #33240f; --warn-ink: #f0a35e; --danger-wash: #3a1b1d;
    --accent: #5b8bff; --accent-ink: #8cb0ff; --accent-wash: #16264a; --ring: rgba(91, 139, 255, .45);
    --ok: #5cc28f; --danger: #f07272; --warn: #f0a35e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 13px/1.5 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── 뼈대: 사이드바 + 본문 ── */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.brand .mark { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; }
.brand .mark i { width: 12px; height: 12px; border-radius: 50%; background: var(--lime-2); display: block; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand span { color: var(--ink-3); font-size: 12px; margin-left: -4px; }
.side .group { padding: 14px 12px 6px; color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.nav { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.nav .ico { width: 18px; height: 18px; }
.nav .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--serious); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.side .foot { margin-top: auto; padding: 12px; border-radius: 14px; background: var(--sunk); color: var(--ink-2); font-size: 12px; text-decoration: none; display: block; }
.side .foot b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 6px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.dots i.off { background: var(--critical); }

.content { min-width: 0; padding: 0 32px 48px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 22px 0 18px; background: var(--paper); }
.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.top p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tools .st { color: var(--ink-3); font-size: 12px; margin-right: 4px; }
body[data-view="notices"] .tools, body[data-view="sources"] .tools .seg { display: none; }
body:not([data-view="notices"]) #pub { display: none; }
#pub { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#pub .st { color: var(--ink-2); font-size: 12px; } #pub .st b { color: var(--ink); font-weight: 600; } #pub .st.muted { color: var(--ink-3); } #pub .st.warn { color: var(--warn); }
.band { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border-radius: 14px; background: var(--warn-wash); color: var(--warn-ink); font-size: 12px; }
.band:empty { display: none; }
.band > span { flex: 1; }
.view { display: none; }
body[data-view="overview"] #v_overview, body[data-view="rhino"] #v_rhino, body[data-view="sketchup"] #v_sketchup, body[data-view="blender"] #v_blender, body[data-view="web"] #v_web,
body[data-view="infra"] #v_infra, body[data-view="sources"] #v_sources, body[data-view="notices"] #v_notices { display: block; }
.loading .view { opacity: .5; transition: opacity .2s; pointer-events: none; }

/* ── 버튼·세그먼트 ── */
.btn { height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--danger); } .btn.danger:hover { background: var(--danger-wash); }
.btn.tog { padding: 0 12px 0 8px; gap: 8px; }
.btn.tog .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--line-2); position: relative; transition: background .15s; }
.btn.tog .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.btn.tog[aria-pressed="true"] { border-color: var(--ink); }
.btn.tog[aria-pressed="true"] .sw { background: var(--ink); }
.btn.tog[aria-pressed="true"] .sw::after { left: 14px; }
.why { font-size: 11.5px; color: var(--ink-3); }
.btn.sm { padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.ib { width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ib:hover { background: var(--hover); color: var(--ink); }
.ib.danger:hover { background: var(--danger-wash); color: var(--danger); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); gap: 2px; flex: none; }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg button.info[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent-ink); }
.seg button.warn[aria-pressed="true"] { background: var(--warn-wash); color: var(--warn); }
input[type=text], textarea { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); }
textarea { height: auto; padding: 6px 10px; resize: vertical; }
input:focus, textarea:focus, .btn:focus-visible, .ib:focus-visible, .seg button:focus-visible, .zone:focus-visible, .nav:focus-visible, .ins:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

/* ── 격자·카드 ── */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; min-width: 0; }
.card > .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; min-height: 28px; }
.card > .hd h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.card > .hd .sub { color: var(--ink-3); font-size: 12px; }
.card > .hd .act { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.card .note { margin: 12px 0 0; color: var(--ink-3); font-size: 11.5px; }
.empty { color: var(--ink-3); font-size: 12px; padding: 18px 0; text-align: center; }
.empty a { color: var(--ink-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 2px; width: 14px; border-radius: 1px; }

/* ── 숫자 타일 ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tiles.t2 { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.kpi .l { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.kpi .l .bub { width: 30px; height: 30px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; color: var(--ink); }
.kpi .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.kpi .m { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); min-height: 22px; }
.dl { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px 0 5px; border-radius: 7px; font-size: 12px; font-weight: 600; }
.dl .ico { width: 13px; height: 13px; stroke-width: 2; }
.dl.up { background: rgba(12, 163, 12, .12); color: var(--good-ink); }
.dl.dn { background: rgba(208, 59, 59, .12); color: var(--critical-ink); }
.dl.nt { background: var(--sunk); color: var(--ink-2); }
.hero { background: var(--lime); border-color: var(--lime-2); color: var(--lime-ink); padding: 20px 22px; }
.hero .l { color: var(--lime-ink); font-size: 14px; font-weight: 600; } .hero .l .bub { background: rgba(255, 255, 255, .6); color: var(--lime-ink); }
.hero .v { font-size: 52px; letter-spacing: -.03em; margin-top: 6px; }
.hero .m { color: var(--lime-ink); opacity: .85; }
.hero .dl.up, .hero .dl.dn, .hero .dl.nt { background: rgba(255, 255, 255, .65); }
.hero .split { display: flex; gap: 18px; margin-top: auto; padding-top: 12px; font-size: 12px; }
.hero .split b { display: block; font-size: 16px; font-weight: 650; }
.spark { display: block; width: 100%; height: 48px; margin-top: 6px; }

/* ── 인사이트 ── */
.ins { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 11px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; border-radius: 0; }
.ins:first-child { border-top: 0; padding-top: 2px; }
.ins:hover .tx { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.ins .lv { flex: none; display: inline-flex; align-items: center; gap: 5px; width: 64px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding-top: 1px; }
.ins .lv .ico { width: 15px; height: 15px; stroke-width: 2; }
.ins .lv.good .ico { color: var(--good); } .ins .lv.warning .ico { color: var(--warning); } .ins .lv.serious .ico { color: var(--critical); } .ins .lv.info .ico { color: var(--info); }
.ins .tx { flex: 1; color: var(--ink-2); line-height: 1.5; }
.ins .ar { color: var(--ink-3); font-size: 11px; flex: none; padding-top: 2px; }

/* ── 막대 목록·비율 막대·게이지·깔때기 ── */
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; font-size: 12.5px; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.bar .n em { font-style: normal; color: var(--ink-3); margin-left: 4px; font-size: 11px; }
.bar .x { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar .x small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.bar .t { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar .t i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
.bar.hi .n { font-weight: 600; }
.more { margin-top: 10px; }
.share { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 0 10px; }
.share i { display: block; height: 100%; }
.share i:first-child { border-radius: 6px 0 0 6px; } .share i:last-child { border-radius: 0 6px 6px 0; } .share i:only-child { border-radius: 6px; }
.shares { display: grid; gap: 6px; }
.shares div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.shares div i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.shares div b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.shares div small { color: var(--ink-3); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.meter { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.meter:first-child { border-top: 0; padding-top: 0; }
.meter .row { display: flex; align-items: baseline; gap: 8px; }
.meter .row b { font-weight: 600; }
.meter .row span { margin-left: auto; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.meter .row span strong { color: var(--ink); font-weight: 600; }
.meter .t { height: 8px; border-radius: 4px; background: var(--s1-wash); overflow: hidden; }
.meter .t i { display: block; height: 100%; border-radius: 4px; background: var(--s1); min-width: 3px; }
.meter .t i.warning { background: var(--warning); } .meter .t i.serious { background: var(--critical); }
.meter .tag { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.meter .tag .ico { width: 13px; height: 13px; stroke-width: 2; }
.meter .tag.warning .ico { color: var(--warning); } .meter .tag.serious .ico { color: var(--critical); } .meter .tag.good .ico { color: var(--good); }
.funnel { display: grid; gap: 10px; }
.fs { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; align-items: center; }
.fs .nm { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.fs .nm small { display: block; color: var(--ink-3); font-size: 11px; }
.fs .tr { height: 30px; border-radius: 8px; background: var(--sunk); position: relative; overflow: hidden; }
.fs .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; min-width: 4px; }
.fs .vv { text-align: right; font-variant-numeric: tabular-nums; }
.fs .vv b { display: block; font-size: 15px; font-weight: 650; }
.fs .vv small { color: var(--ink-3); font-size: 11px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.stat-row div { padding: 10px 12px; border-radius: 12px; background: var(--sunk); }
.stat-row span { display: block; color: var(--ink-3); font-size: 11.5px; }
.stat-row b { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }

/* ── 차트·표·지도 ── */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .bl { stroke: var(--line-2); stroke-width: 1; }
.chart .cx { stroke: var(--ink-3); stroke-width: 1; }
.chart rect.hit { fill: transparent; }
.chart g.col:hover path, .chart g.col.on path { opacity: .82; }
#tip { position: fixed; z-index: 50; pointer-events: none; min-width: 120px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(17, 20, 24, .12); font-size: 12px; display: none; }
#tip .d { color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; }
#tip .r i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
#tip .r b { font-weight: 650; font-variant-numeric: tabular-nums; }
#tip .r span { color: var(--ink-3); }
table.tb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12.5px; }
table.tb th { text-align: left; color: var(--ink-3); font-weight: 500; font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
table.tb td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.tb .r { text-align: right; }
.scroll { max-height: 280px; overflow: auto; }
.map { height: 340px; border-radius: 12px; overflow: hidden; background: var(--sunk); z-index: 0; }
.leaflet-container { font: inherit; background: var(--sunk); }

/* ── 연결 ── */
.src { display: grid; grid-template-columns: 24px 190px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.src:first-child { border-top: 0; padding-top: 0; }
.src .ico { width: 18px; height: 18px; stroke-width: 2; margin-top: 1px; }
.src.on .ico { color: var(--good); } .src.off .ico { color: var(--critical); }
.src b { font-weight: 600; } .src b small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
.src span { color: var(--ink-2); word-break: break-all; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); }
ol.steps code, .card code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--sunk); padding: 1px 5px; border-radius: 5px; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips code.miss { color: var(--critical-ink); }

/* ── 공지·버전 (기존 편집기) ── */
.notices-grid { display: grid; grid-template-columns: minmax(0, 1fr) 482px; gap: 24px; align-items: start; }
.notices-grid .card { margin-bottom: 16px; }
.notices-grid .card h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.notices-grid .card h2 .sub { color: var(--ink-3); font-size: 12px; font-weight: 400; }
input.ver { width: 96px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: center; }
.lead { margin: 0 0 12px; color: var(--ink-2); }
.hint { color: var(--ink-3); font-size: 11px; }

.nb { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; }
.nb + .nb { margin-top: 8px; }
.nb.info { background: var(--accent-wash); color: var(--accent-ink); }
.nb.warn { background: var(--warn-wash); color: var(--warn); }
.nb > .ico { margin-top: 2px; }
.nb .body { flex: 1; min-width: 0; }
.nb .meta { margin-top: 2px; color: var(--ink-3); font-size: 11px; }
.nb .meta .new { color: var(--accent-ink); } .nb .meta .mod { color: var(--warn); }
.nb .acts { display: flex; gap: 2px; margin: -4px -6px -4px 0; }
.nb.gone { background: none; border: 1px dashed var(--line-2); color: var(--ink-3); }
.nb.gone .text { text-decoration: line-through; }
.nb.edit { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--accent); color: var(--ink); }
.zones { display: grid; gap: 6px; margin-bottom: 16px; }
.zone { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-left-width: 3px; border-radius: 0 10px 10px 0; background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.zone:hover { background: var(--hover); }
.zone.ok { border-left-color: var(--ok); } .zone.soft { border-left-color: var(--warn); } .zone.hard { border-left-color: var(--danger); }
.zone[aria-pressed="true"] { background: var(--hover); box-shadow: inset 0 0 0 1px var(--line-2); }
.zone .range { font-weight: 600; font-variant-numeric: tabular-nums; }
.zone .eff b { font-weight: 600; }
.zone .eff span { display: block; color: var(--ink-3); font-size: 11px; }
.zone .see { color: var(--ink-3); font-size: 11px; }
.zone[aria-pressed="true"] .see { color: var(--ink); }
.form { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; align-items: start; }
.form > label { padding-top: 6px; color: var(--ink-2); font-size: 12px; }
.form .hint { margin-top: 4px; }
.form .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px 0; }
.foot { display: flex; justify-content: flex-end; margin-top: 12px; }
#errors:empty { display: none; }
#errors { margin-bottom: 16px; padding: 10px 12px; border-radius: 12px; background: var(--warn-wash); color: var(--warn); font-size: 12px; }
#errors ul { margin: 4px 0 0; padding-left: 18px; }
.notices-grid aside { position: sticky; top: 96px; }

aside iframe { display: block; width: 482px; height: calc(100vh - 150px); min-height: 560px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--on-ink); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.on { opacity: 1; }

/* ── 프로그램 카드(개요 첫 줄)·프로그램 머리 ── */
.pdot { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
.pdot::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--pc); }
.nav[aria-current="page"] .pdot::before { box-shadow: 0 0 0 2px var(--on-ink); }
.progs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.prog { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; border-top: 4px solid var(--pc); transition: border-color .15s, box-shadow .15s; }
.prog:hover { box-shadow: 0 6px 22px rgba(17, 20, 24, .08); }
.prog:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
.ph, .phead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ph i, .phead i { width: 12px; height: 12px; border-radius: 4px; background: var(--pc); flex: none; }
.ph b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.phead { margin: 0 0 16px; } .phead b { font-size: 15px; font-weight: 600; }
.stt { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 11.5px; }
.phead .stt { margin-left: 4px; }
.prog .stt { flex-basis: 100%; margin-left: 0; }
.cmp .scroll { max-height: none; }
.band.wait { background: var(--sunk); color: var(--ink-2); }
.band.wait .ico { color: var(--warning); }
.stt::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.stt.on::before { background: var(--good); } .stt.wait::before { background: var(--warning); } .stt.off::before { background: var(--critical); }
.big { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big span { display: block; color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.big b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0; }
.big small { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 11.5px; min-height: 22px; }
.prog .spark { color: var(--pc); height: 40px; margin: 0; }
.spark-empty { height: 40px; display: grid; place-items: center; color: var(--ink-3); font-size: 11.5px; background: var(--sunk); border-radius: 10px; }
.prog dl { margin: 0; display: grid; }
.prog dl div { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.prog dt { color: var(--ink-2); } .prog dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.cmp table.tb td:first-child { white-space: nowrap; }
.cmp table.tb td, .cmp table.tb th { padding: 9px 10px; }
.cmp table.tb td.r { font-size: 14px; font-weight: 600; }
.cmp table.tb td:last-child, .cmp table.tb th:last-child { background: var(--sunk); }
.mute { color: var(--ink-3); font-weight: 400; }
.tiles + .band { margin-top: -4px; }
@media (max-width: 1280px) { .progs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .progs { grid-template-columns: minmax(0, 1fr); } }

@media (max-width: 1280px) { .s3, .s4, .s5, .s7, .s8, .s9 { grid-column: span 6; } .notices-grid { grid-template-columns: minmax(0, 1fr); } .notices-grid aside { position: static; } aside iframe { width: 100%; max-width: 482px; height: 760px; } }

<script>
"use strict";
var TOKEN = (location.search.match(/[?&]token=([\w-]+)/) || [])[1] || "";
var VER = /^\d+(\.\d+)*$/;
// data = 초안(docs/notices.json), remote = 지금 사용자에게 게시된 것. editing = 고치는 공지 id, view = 미리 볼 버전 구간
var S = { data: { update: null, notices: [] }, remote: null, version: "", today: "", changes: [], errors: [], remoteError: "", editing: null, view: "", newLevel: "info" };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function ico(n) { return '<svg class="ico" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
function api(path, body) {
  var url = path + (path.indexOf("?") < 0 ? "?" : "&") + "token=" + TOKEN;
  return fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}).then(function (r) { return r.json(); });
}
function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 2600); }
function cmpVer(a, b) {
  var x = String(a || "0").split("."), y = String(b || "0").split(".");
  for (var i = 0; i < Math.max(x.length, y.length); i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d; }
  return 0;
}
function lowerThan(v) { var p = String(v).split("."); for (var i = p.length - 1; i >= 0; i--) { if (+p[i] > 0) { p[i] = +p[i] - 1; return p.join("."); } } return "0"; }
function ask(title, text, items, ok) {   // 확인 창 → Promise<bool>
  var d = $("ask"); $("ask_title").textContent = title; $("ask_text").textContent = text; $("ask_ok").textContent = ok;
  $("ask_list").innerHTML = (items || []).map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");
  d.showModal();
  return new Promise(function (resolve) { d.onclick = function (e) { var b = e.target.closest("button"); if (b) { d.close(); resolve(b.value === "yes"); } }; d.oncancel = function () { resolve(false); }; });
}

// ── 버전 구간 — 패널 updateLevel과 같은 판정. 미리볼 버전은 구간마다 하나 ──
function getZones() {
  var u = S.data.update; if (!u || !VER.test(u.latest || "")) return [];
  var L = u.latest, M = VER.test(u.min || "") ? u.min : "", zones = [{ key: "ok", range: L + " 이상", eff: "<b>안내 없음</b>", sub: "최신이라 평소 화면", as: L }];
  if (!M || cmpVer(M, L) < 0) {
    var soft = M && cmpVer(lowerThan(L), M) < 0 ? M : lowerThan(L);
    zones.push({ key: "soft", range: (M ? M + " ~ " : "") + L + " 미만", eff: "<b>업데이트 권장</b>", sub: "하루 한 번 안내창(나중에 가능) + 업데이트할 때까지 주황 띠", as: soft });
  }
  if (M) zones.push({ key: "hard", range: M + " 미만", eff: "<b>사용 불가</b>", sub: "닫을 수 없는 안내창 — 업데이트해야 씁니다(지난 결과 폴더만 열림)", as: lowerThan(M) });
  return zones;
}
function viewZone() {
  var zones = getZones(), z = zones.filter(function (x) { return x.key === S.view; })[0];
  return z || zones.filter(function (x) { return x.key === "soft"; })[0] || zones[zones.length - 1] || null;
}
function previewVersion() { var z = viewZone(); return z ? z.as : S.version; }

// ── 그리기 ──
function renderPub() {
  var el = $("pub"), n = S.changes.length;
  if (S.remoteError) el.innerHTML = '<span class="st warn">' + esc(S.remoteError) + '</span><button type="button" class="btn sm" data-act="retry">다시 시도</button>';

    card(5, "GA 연결하기", "처음 한 번", '<ol class="steps">' +
      "<li>Google Cloud 콘솔에서 <b>Google Analytics Data API</b>와 <b>Admin API</b>를 켭니다.</li>" +
      "<li>서비스 계정을 만들고 JSON 키를 받아 <code>" + esc(D.ga_key_path) + "</code>에 둡니다. 저장소 밖이라 공개되지 않습니다.</li>" +
      "<li>GA 관리 → 속성 액세스 관리에서 Rhino·SketchUp·웹 속성마다 서비스 계정 이메일을 <b>편집자</b>로 추가합니다(아래 등록 버튼에 필요, 등록 뒤 뷰어로 내려도 됩니다).</li>" +
      "<li>아래 [매개변수 한 번에 등록]을 누릅니다. 등록한 날부터 쌓이고 지난 기록은 채워지지 않습니다.</li></ol>" +
      '<div class="row" style="margin-top:14px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="register"' + (ok ? "" : " disabled") + '>매개변수 한 번에 등록</button>' +
      '<button type="button" class="btn" data-act="demo">' + (V.demo ? "예시 끄기" : "예시 데이터로 보기") + '</button></div><div id="register_out" class="note"></div>')]) +
    grid([card(12, "내 시험 설치 ID", "국내 서버 기록 · [내 테스트 제외]가 빼는 것", clientTable())]) +
    grid([card(12, "GA 맞춤 측정기준", "대시보드가 읽는 이벤트 매개변수", props.join(""))]) +
    grid([card(12, "숫자 읽을 때 주의", "", '<ol class="steps">' +
      "<li>개발자 본인의 시험 사용도 GA·서버 숫자에 들어갑니다. 출시 초기에는 비중이 큽니다.</li>" +
      "<li>플러그인 이벤트는 서버 없이 보내 GA가 나라를 모릅니다(<code>(not set)</code>). 지역은 대상지 위치(<code>lng</code>·<code>lat</code>·PNU)로 봅니다.</li>" +
      "<li>플러그인은 GA가 '신규 사용자'를 세지 못합니다(Measurement Protocol은 first_visit를 보내지 않음). 새 설치는 yak 다운로드·국내 서버 설치 ID로 봅니다.</li>" +
      "<li>SketchUp은 동의한 사용자만 보냅니다. Blender는 보내지 않습니다(스토어 규정). 같은 기능의 Rhino와 직접 비교하지 마세요.</li>" +
      "<li>웹과 플러그인은 GA 속성이 달라 같은 사람으로 이어지지 않습니다. 깔때기는 단계별 규모 비교입니다.</li>" +
      "<li>국내 서버는 기록을 2주만 남깁니다. 관리자 페이지를 열 때마다 이 Mac(<code>~/.config/gorani/udt.log</code>)에 이어 붙여 보관합니다.</li></ol>")]);
}

function clientTable() {
  var rows = D.gate_clients || [], why = { mac: "이 Mac 설치본", ua: "시험 도구(curl·HeadlessChrome)", marked: "직접 표시함", "": "" };
  if (!rows.length) return empty("국내 서버 기록을 받지 못했습니다");
  return '<p class="note" style="margin:0 0 10px">팩을 받은 설치마다 무작위 ID가 하나씩 있습니다. 시험할 때 HOME을 바꿔 띄우면 새 ID가 생깁니다 — 날짜·횟수로 내 시험인 것을 골라 표시하세요. ' +
    "GA 쪽은 이 Mac(<code>~/.config/gorani/</code>가 있는 PC)에서 보낸 이벤트에 자동으로 <code>dev</code> 표시가 붙습니다.</p>" +
    table(["설치 ID", "받기", "기간", "마지막 프로그램", "내 시험"], rows.map(function (r) {
      var locked = r[5] === "mac" || r[5] === "ua", on = !!r[5];
      return ['<code title="' + esc(r[0]) + '">' + esc(r[0].slice(0, 8)) + "</code>", fmtNum(r[1]), esc(fmtDay(r[2]) + (r[2] === r[3] ? "" : " – " + fmtDay(r[3]))), esc(r[4]),
        '<button type="button" class="btn sm tog" data-client="' + esc(r[0]) + '" aria-pressed="' + on + '"' + (locked ? " disabled" : "") + '><span class="sw" aria-hidden="true"></span>' + (on ? "내 시험" : "사용자") + "</button>" +
        (r[5] ? ' <span class="why">' + esc(why[r[5]]) + "</span>" : "")];
    }), [1]) +
    '<p class="note">웹사이트: 개발용 브라우저에서 <a href="https://969flash.github.io/gorani/?dev=1" target="_blank" rel="noopener">이 주소</a>를 한 번 열면 그 브라우저의 방문에 <code>dev</code> 표시가 붙습니다(localhost는 자동). 웹사이트에 반영(push)한 뒤부터 동작합니다.</p>';
}

// ── 그리기·불러오기 ──
var RENDER = { overview: renderOverview, rhino: renderProgram, sketchup: renderProgram, blender: renderBlender, web: renderWeb, infra: renderInfra, sources: renderSources };
function renderChrome() {
  var page = PAGES[V.view] || PAGES.overview;
  $("page_title").textContent = page[0]; $("page_sub").textContent = page[1];
  document.body.dataset.view = V.view;
  document.querySelectorAll("[data-nav]").forEach(function (a) { if (a.dataset.nav === V.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("days").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.days === V.days)); });
  $("exclude").setAttribute("aria-pressed", String(V.exclude));
  if (!D) return;
  var p = D.period;
  $("stats_time").textContent = fmtDay(p.cur[0]) + "–" + fmtDay(p.cur[1]) + " · 직전 " + fmtDay(p.prev[0]) + "–" + fmtDay(p.prev[1]) + " 비교 · " + D.updated.slice(11) + " 갱신";
  var on = D.sources.filter(function (s) { return s.ok; }).length;
  $("side_foot").innerHTML = "<b>데이터 출처 " + on + "/" + D.sources.length + "</b><span class=\"dots\">" + D.sources.map(function (s) { return '<i class="' + (s.ok ? "" : "off") + '" title="' + esc(s.name) + '"></i>'; }).join("") + "</span>";
  var band = "";
  if (V.view !== "notices") {
    if (D.demo) band = ico2("warn") + "<span><b>예시 데이터</b> — GA 자리는 화면 확인용 가짜 숫자입니다. yak·Hugging Face·국내 서버는 실제입니다.</span>" + '<button type="button" class="btn sm" data-act="demo">예시 끄기</button>';
    else if (!gaOn()) band = ico2("info") + "<span>GA가 아직 연결되지 않아 사용·유입 숫자가 비어 있습니다.</span>" + '<a class="btn sm" href="#sources">연결 설정</a><button type="button" class="btn sm" data-act="demo">예시로 미리 보기</button>';
  }
  $("band").innerHTML = band;
  var ex = "";
  if (V.view !== "notices" && D.exclude_dev && !D.demo) {
    var marked = (D.gate_clients || []).filter(function (r) { return r[5]; }).length;
    ex = ico2("check") + "<span><b>내 테스트 빼고 보는 중</b> — 국내 서버: 내 시험 설치 " + marked + "곳(이 Mac·표시한 것·curl 등). " +
      "GA: 개발 PC·브라우저 표시(dev)가 붙은 이벤트 — 10/22부터 붙어서 그 전 GA 기록은 그대로입니다.</span>" + '<a class="btn sm" href="#sources">설치 ID 고르기</a>';
  }
  $("band_ex").innerHTML = ex;
}
function render() {
  renderChrome();
  if (V.view === "notices") return;
  var el = $("v_" + V.view);
  if (!D) { el.innerHTML = empty("GA·yak·Hugging Face·국내 서버에서 숫자를 모으는 중입니다(몇 초)…"); return; }
  CHARTS = {}; MAP_SPECS = [];
  el.innerHTML = RENDER[V.view]();
  drawCharts(); drawMaps();
}
function load(refresh) {
  V.loading = true; $("content").classList.add("loading"); $("stats_time").textContent = "모으는 중…";
  api("/api/stats?days=" + V.days + (V.demo ? "&demo=1" : "") + (V.exclude ? "&exclude=1" : "") + (refresh ? "&refresh=1" : "")).then(function (r) {
    D = r; V.loading = false; $("content").classList.remove("loading"); render();
  }, function () { V.loading = false; $("content").classList.remove("loading"); $("stats_time").textContent = "불러오지 못했습니다 — 새로고침"; });
}
function route() {
  var v = location.hash.slice(1);
  V.view = PAGES[v] ? v : "overview"; V.host = v === "rhino" || v === "sketchup" ? v : null;
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", function () { clearTimeout(route.t); route.t = setTimeout(drawCharts, 150); });
document.addEventListener("click", function (e) {
  var b = e.target.closest("button, a[data-act]"); if (!b || b.closest("dialog")) return;
  var act = b.dataset.act;
  if (b.dataset.days) { V.days = +b.dataset.days; renderChrome(); load(); }
  else if (b.dataset.go) location.hash = b.dataset.go;
  else if (act === "refresh") load(true);
  else if (act === "exclude") { V.exclude = !V.exclude; localStorage.setItem("gorani_admin_exclude", V.exclude ? "1" : "0"); renderChrome(); load(); }
  else if (act === "demo") { e.preventDefault(); V.demo = !V.demo; history.replaceState(null, "", location.pathname + "?token=" + TOKEN + (V.demo ? "&demo=1" : "") + location.hash); load(); }
  else if (act === "more") { var box = $(b.dataset.more); box.querySelectorAll("[hidden]").forEach(function (x) { x.hidden = false; }); b.remove(); }
  else if (act === "table") { var c = CHARTS[b.dataset.chart]; c.table = !c.table; b.setAttribute("aria-pressed", String(c.table)); drawChart($(b.dataset.chart), c); }
  else if (b.dataset.client) {
    b.disabled = true;
    api("/api/dev_client", { id: b.dataset.client, dev: b.getAttribute("aria-pressed") !== "true" }).then(function () { load(true); });
  }
  else if (act === "register") {
    b.disabled = true; $("register_out").textContent = "등록하는 중…";
    api("/api/ga_register", {}).then(function (r) { $("register_out").innerHTML = r.lines.map(esc).join("<br>"); b.disabled = false; if (r.ok) load(true); });
  }
});
route();
load();
</script>
</body>
</html>
